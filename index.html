<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Key Personnel — what constrains filling and keeping an opening at a small technical firm whose hires must satisfy a contract or a customer: sixty evidence-graded constraints, the levers and what each does not do, the gates that bind, and a cited dependency map. A commissioned guide: not peer reviewed, not legal, HR or compliance advice; current as of 2026-10-22." />
    <meta name="color-scheme" content="light dark" />
    <title>Key Personnel</title>
    <script>
      // Apply the persisted / system theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem('bx-theme');
        if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
