# links.yaml — Key Personnel · the dependency graph, drawn exactly; nothing inferred. Sweep 1: edges inside the select stage.
# relation: precondition (head cannot be addressed until the tail is) | amplifies (tail makes head worse) | trade-off (acting on the tail worsens the head) | enables (acting on the tail makes the head easier)
# Every edge carries its own cited evidence; `grade` is the strongest source grade on the edge; synthesis is marked in the text.
- id: k-001
  from: c-unvalidated-criteria
  to: c-keyword-screen-rejects-qualified
  relation: precondition
  link: 'an unvalidated screen encodes weak proxies'
  evidence: >
    A screen built without a job analysis defaults to convenient proxies, and the convenient proxies are the least predictive:
    years of experience carries an operational validity of .07 against .40 for job knowledge [1]. Employers using exact-match
    criteria report rejecting qualified candidates outright (88 percent) [44]. The Uniform Guidelines tie validity to important
    elements of job performance, which is what the job analysis supplies [32].
  grade: meta-analysis
  legacy: [h-E3, h-B3]
  sources: [1, 32, 44]

- id: k-002
  from: c-unvalidated-criteria
  to: c-algorithmic-screen-exposure
  relation: amplifies
  link: 'no validation evidence, no defence for an automated screen'
  evidence: >
    An algorithmic tool used to make or inform decisions is a selection procedure under the Uniform Guidelines, so the same
    validity evidence is expected of it [35]; California treats anti-bias testing before and after adoption as a factor in
    the employer's defence [40]. A firm that has not validated its criteria has nothing to show when the tool shows impact
    (synthesis).
  grade: regulation
  legacy: []
  sources: [35, 40]

- id: k-003
  from: c-unstructured-judgement
  to: c-validity-diversity-tradeoff
  relation: amplifies
  link: 'judgement adds group difference without adding validity'
  evidence: >
    Unstructured interviews carry a Black–White d of .32 at a validity of .19, against .23 and .42 for structured interviews
    [1]; replacing an informal screen with a standardised test did not reduce minority hiring at a national retailer, which the
    authors attribute to the informal screen being no less biased [11].
  grade: meta-analysis
  legacy: []
  sources: [1, 11]

- id: k-004
  from: c-slow-decisions-lose-candidates
  to: c-process-burden-withdrawal
  relation: amplifies
  link: 'delay is itself a stage candidates leave at'
  evidence: >
    Earlier post-interview offers were more often accepted [15]; withdrawal from a multi-hurdle process tracked perceptions of
    the organisation and the process and differed by stage [16]; perceptions of the process predict acceptance intentions [14].
    That slowness and burden compound is a synthesis of the three.
  grade: observational
  legacy: [h-E2, h-E4]
  sources: [14, 15, 16]

- id: k-005
  from: c-technical-interview-measures-anxiety
  to: c-process-burden-withdrawal
  relation: amplifies
  link: 'an anxiety-laden format is a reason to leave'
  evidence: >
    Developers describe technical interviews as time-consuming, anxiety-provoking and governed by unwritten norms [22]; being
    watched halved performance and raised measured stress in a randomised trial [21]; face validity and perceived fairness
    predict attraction and acceptance intentions [14]. The step from "aversive format" to "withdrawal" is a synthesis.
  grade: observational
  legacy: [h-E4]
  sources: [14, 21, 22]

- id: k-006
  from: c-technical-interview-measures-anxiety
  to: c-keyword-screen-rejects-qualified
  relation: amplifies
  link: 'two filters that both miss capable people'
  evidence: >
    A watched live-coding exercise screens on stress tolerance and format preparation [21] [22]; an exact-match résumé screen
    discards candidates lacking a token [44]. Applied in sequence, each removes people the other would have passed
    (synthesis).
  grade: observational
  legacy: []
  sources: [21, 22, 44]

- id: k-007
  from: c-premature-inquiries
  to: c-process-burden-withdrawal
  relation: amplifies
  link: 'questions that feel intrusive or exclusionary read as unfair'
  evidence: >
    Procedural-justice perceptions predict organisational attractiveness and acceptance intentions [14]; the inquiries the law
    reserves (disability, criminal history, citizenship) are the ones most likely to be read as intrusive [34] [47] [49]
    (synthesis).
  grade: observational
  legacy: [h-E6]
  sources: [14, 34, 47, 49]

- id: k-008
  from: l-work-sample-or-knowledge-test
  to: c-validity-diversity-tradeoff
  relation: trade-off
  link: 'adds validity and the largest subgroup differences'
  evidence: >
    Work samples (d .67) and job-knowledge tests (d .54) carry larger Black–White differences than structured interviews (.23)
    while predicting at .33 and .40 [1]; the Uniform Guidelines require more validity evidence when a procedure is used to rank
    rather than pass/fail [32].
  grade: meta-analysis
  legacy: []
  sources: [1, 32]

- id: k-009
  from: l-affirmative-skill-filters
  to: c-process-burden-withdrawal
  relation: trade-off
  link: 'a wider pool means more people to assess'
  evidence: >
    Affirmative filters admit candidates the negative filter would have removed [44]; the assessment that follows has to carry
    the validity [1], and each added stage is a point of withdrawal [16] (synthesis).
  grade: practitioner-survey
  legacy: [h-A8]
  sources: [1, 16, 44]

- id: k-010
  from: l-structured-interview
  to: c-unstructured-judgement
  relation: enables
  link: 'structure replaces impression with score'
  evidence: >
    Structured interviews predict at .42 against .19 for unstructured [1]; the structure components that carry validity are
    used by interviewers who were formally trained [19].
  grade: meta-analysis
  legacy: [h-E3]
  sources: [1, 19]

- id: k-011
  from: l-mechanical-scoring
  to: c-unstructured-judgement
  relation: enables
  link: 'the formula keeps the judgement from diluting the evidence'
  evidence: >
    Formula combination of the same information predicts at r .44 against .28 for judgement [7]; adding an unstructured
    interview to test scores lowered accuracy and raised overconfidence [9].
  grade: meta-analysis
  legacy: [h-E3]
  sources: [7, 9]

- id: k-012
  from: l-validate-and-document-screen
  to: c-unvalidated-criteria
  relation: enables
  link: 'validation evidence is the gate''s currency'
  evidence: >
    The Uniform Guidelines accept criterion-related, content or construct evidence tied to important elements of job
    performance [32] and expect selection-rate records by group [31]; the SIOP Principles define professional practice [29].
  grade: regulation
  legacy: [h-B5]
  sources: [29, 31, 32]

- id: k-013
  from: l-fast-decision-and-offer
  to: c-slow-decisions-lose-candidates
  relation: enables
  link: 'faster offers, more acceptances, no quality penalty'
  evidence: >
    Earlier offers were more likely to be accepted in both candidate pools, with no difference in performance or turnover
    between fast- and slow-offer hires [15].
  grade: observational
  legacy: [h-E2]
  sources: [15]

- id: k-014
  from: l-realistic-job-preview
  to: c-process-burden-withdrawal
  relation: trade-off
  link: 'candour thins the pipeline early'
  evidence: >
    Realistic previews lower initial expectations and attrition during recruitment and reduce later turnover [12]; some
    candidates leave because of the preview, which is the mechanism (synthesis from [12]).
  grade: meta-analysis
  legacy: [h-E6]
  sources: [12]

- id: k-015
  from: l-conditional-offer-sequencing
  to: c-premature-inquiries
  relation: enables
  link: 'moving the question moves the liability'
  evidence: >
    Disability-related questions and medical exams become permissible after a conditional offer if asked of everyone in the
    job category [34]; criminal-history inquiries for contract positions become permissible after a conditional offer [48];
    export screening separated from Form I-9 and postings written for all U.S. persons avoid the 1324b violations DOJ has
    settled [51] [49].
  grade: regulation
  legacy: [h-E6]
  sources: [34, 48, 49, 51]

# ---- sweep 2 (attract), 2026-10-21 ----
- id: k-016
  from: c-degree-requirement-shrinks-pool
  to: c-keyword-screen-rejects-qualified
  relation: precondition
  link: 'the requirement in the ad becomes the filter in the screen'
  evidence: >
    Roles that dropped degree requirements from their postings changed hiring by 3.5 percentage points and less than one hire
    in 700 economy-wide, because the screens did not change [68]; employers report exact-match rejections of qualified
    candidates [44]. The posting requirement is the screen's criterion (synthesis).
  grade: observational
  legacy: [h-B3]
  sources: [44, 68]

- id: k-017
  from: c-cleared-supply-scarce
  to: c-local-pool-thin
  relation: amplifies
  link: 'a closed pool inside a thin one'
  evidence: >
    No individual can initiate a clearance; only a sponsoring agency can [80], so the cleared pool within any local market is
    fixed in the short run. Small firms already report few or no qualified applicants at 87 percent [71].
  grade: report
  legacy: [h-A2]
  sources: [71, 80]

- id: k-018
  from: c-referral-network-narrow
  to: c-local-pool-thin
  relation: amplifies
  link: 'segregated networks reach the same people'
  evidence: >
    Referral networks are segregated and reproduce the founders' composition until cumulative hiring dilutes it [81];
    referrals are nonetheless the source with the best retention evidence [60], so a narrow network is both the best channel
    and the smallest (synthesis).
  grade: observational
  legacy: [h-A8]
  sources: [60, 81]

- id: k-019
  from: c-channel-mix-untested
  to: c-posting-draws-wrong-applicants
  relation: precondition
  link: 'you cannot fix a channel you do not measure'
  evidence: >
    Sources differ in tenure and performance [62]; without per-source records of qualified rate, starts and retention the
    difference is invisible and spending stays on volume (synthesis). The Uniform Guidelines' selection-rate records are the
    natural place for the source field [31].
  grade: observational
  legacy: [h-A5]
  sources: [31, 62]

- id: k-020
  from: c-employer-image-weak
  to: c-posting-draws-wrong-applicants
  relation: amplifies
  link: 'an unknown firm is judged on the posting alone'
  evidence: >
    Organisation characteristics and image predict attraction [63] [64]; where the firm has no footprint, the posting and the
    recruiter carry the whole impression (synthesis).
  grade: meta-analysis
  legacy: [h-A4]
  sources: [63, 64]

- id: k-021
  from: c-ad-wording-and-targeting-exclude
  to: c-local-pool-thin
  relation: amplifies
  link: 'excluding by words and delivery shrinks a pool that was already small'
  evidence: >
    Masculine-coded wording lowers women's appeal for the same job [77]; cost-optimised delivery shows a neutral ad to fewer
    women [66]; age terms and citizenship restrictions exclude by law [78] [49].
  grade: field-experiment
  legacy: []
  sources: [49, 66, 77, 78]

- id: k-022
  from: l-employee-referral-program
  to: c-local-pool-thin
  relation: enables
  link: 'referrals reach people who were not looking'
  evidence: >
    Referred applicants are more likely to be interviewed and hired and quit 10–30% less [60] [61]; referral is the channel
    that reaches candidates outside the posting market (synthesis).
  grade: quasi-experimental
  legacy: [h-A3]
  sources: [60, 61]

- id: k-023
  from: l-employee-referral-program
  to: c-referral-network-narrow
  relation: trade-off
  link: 'more referrals, same networks'
  evidence: >
    A referral program draws on segregated networks and reproduces the founders' composition [81]; referrals from
    below-median workers were worth less than non-referred hires [60].
  grade: observational
  legacy: [h-A8]
  sources: [60, 81]

- id: k-024
  from: l-remote-or-hybrid-option
  to: c-local-pool-thin
  relation: enables
  link: 'remote work replaces relocation'
  evidence: >
    1.6 percent of job seekers relocated for a job in early 2023 [85]; workers value a hybrid option at 8 percent of pay and
    half of surveyed firms use remote work to keep staff [70].
  grade: observational
  legacy: [h-A1]
  sources: [70, 85]

- id: k-025
  from: l-posting-rewrite
  to: c-posting-draws-wrong-applicants
  relation: enables
  link: 'title and range set the applicant count'
  evidence: >
    Within a job title, a 10 percent higher posted wage draws 7.7 percent more applicants [65]; most competing postings show
    pay [75].
  grade: observational
  legacy: [h-A6]
  sources: [65, 75]

- id: k-026
  from: l-posting-rewrite
  to: c-ad-wording-and-targeting-exclude
  relation: enables
  link: 'the words are the cheapest fix'
  evidence: >
    Removing masculine-coded words restores women's appeal and belonging ratings [77]; removing the listed age terms and
    citizenship restrictions removes the statutory violations [78] [51].
  grade: field-experiment
  legacy: []
  sources: [51, 77, 78]

- id: k-027
  from: l-skills-based-requirements
  to: c-degree-requirement-shrinks-pool
  relation: enables
  link: 'name the skills, drop the proxy'
  evidence: >
    Years of experience predicts at .07 [1]; non-degree hires made after requirement removals stayed longer [68]; the lever
    works only with a changed screen [68] [44].
  grade: observational
  legacy: [h-B3]
  sources: [1, 44, 68]

- id: k-028
  from: l-source-of-hire-tracking
  to: c-channel-mix-untested
  relation: enables
  link: 'a source field makes the difference visible'
  evidence: >
    Inside sources outperform outside ones on tenure and performance [62]; the Uniform Guidelines already expect selection-rate
    records at each stage [31].
  grade: observational
  legacy: [h-A5]
  sources: [31, 62]

- id: k-029
  from: l-military-transition-pipeline
  to: c-local-pool-thin
  relation: enables
  link: 'a national pool with a program attached'
  evidence: >
    8.3 million veterans in the labour force, 41.8 percent of employed Gulf War-era II men in management and professional work
    [72]; SkillBridge supplies members in their last 180 days under a 75 percent offer standard [74]; VEVRAA listing brings
    priority referral [73].
  grade: regulation
  legacy: [h-A8]
  sources: [72, 73, 74]

- id: k-030
  from: l-employer-image-management
  to: c-employer-image-weak
  relation: enables
  link: 'image forms through recruiters and word of mouth'
  evidence: >
    Favourable images relate to better recruitment outcomes and are formed by recruiters and word of mouth [64]; recruiter
    behaviour and process perceptions predict attraction [63].
  grade: meta-analysis
  legacy: [h-A4]
  sources: [63, 64]

- id: k-031
  from: l-ad-delivery-audit
  to: c-ad-wording-and-targeting-exclude
  relation: enables
  link: 'see who the platform showed the ad to'
  evidence: >
    A neutral ad reached fewer women through cost optimisation [66]; targeted job ads are automated-decision systems under
    California's regulations [40].
  grade: field-experiment
  legacy: []
  sources: [40, 66]

- id: k-032
  from: c-posting-draws-wrong-applicants
  to: c-keyword-screen-rejects-qualified
  relation: amplifies
  link: 'volume without fit overloads the screen'
  evidence: >
    A posting that draws the wrong queue [65] feeds an exact-match screen that then rejects on tokens [44]; the two compound
    (synthesis).
  grade: observational
  legacy: [h-A6, h-E3]
  sources: [44, 65]

# ---- sweep 3 (offer), 2026-10-21 ----
- id: k-033
  from: c-contract-rates-lag-market
  to: c-salary-above-rate
  relation: precondition
  link: 'the rate ceiling sets the range ceiling'
  evidence: >
    The labor-category rate contains the wage, indirect costs and profit [98] and moves only through the adjustment clause's
    limited windows [117], while market wages rose 3.1 percent in the year [103]; a lagging rate is a lagging range (synthesis).
  grade: regulation
  legacy: [h-D1, h-D2]
  sources: [98, 103, 117]

- id: k-034
  from: c-salary-above-rate
  to: c-posting-draws-wrong-applicants
  relation: amplifies
  link: 'a range the market rejects draws the wrong queue'
  evidence: >
    Within a job title, a 10 percent higher posted wage draws 7.7 percent more applicants [65], so a range held down by the
    rate draws fewer and different applicants; most competing postings show pay [75].
  grade: observational
  legacy: [h-A1, h-A6]
  sources: [65, 75]

- id: k-035
  from: c-salary-above-rate
  to: c-local-pool-thin
  relation: amplifies
  link: 'an unaffordable range makes wider sourcing futile'
  evidence: >
    Applicant counts respond to the posted wage within a title [65]; a pool widened by remote work or referrals still prices
    the offer against the market (synthesis from [65] [70]). This is the matrix's A1→D1 dependency, now with evidence.
  grade: observational
  legacy: [h-A1]
  sources: [65, 70]

- id: k-036
  from: l-set-range-from-rate-and-market
  to: c-salary-above-rate
  relation: enables
  link: 'know the ceiling before recruiting'
  evidence: >
    The rate is the contractual ceiling [98] [99]; benchmarking against OEWS [110] and CALC+ [111] shows whether the range can
    compete; a pre-approved range lets the offer follow the interview fast, which raises acceptance [15].
  grade: regulation
  legacy: [h-D1]
  sources: [15, 98, 99, 110, 111]

- id: k-037
  from: l-set-range-from-rate-and-market
  to: c-new-hire-pay-compresses-incumbents
  relation: trade-off
  link: 'a market-matched range lands above incumbents'
  evidence: >
    External hires into comparable jobs started about 18 percent above internal promotees [93]; incumbents below the new
    comparison point lose satisfaction and search more [92]; the gap cannot be closed by cutting pay [112].
  grade: observational
  legacy: [h-D4]
  sources: [92, 93, 112]

- id: k-038
  from: c-new-hire-pay-compresses-incumbents
  to: c-contract-rates-lag-market
  relation: amplifies
  link: 'incumbent raises need rate relief too'
  evidence: >
    Raising incumbents to the new hire's level is a recurring cost under a rate that moves only at adjustment windows [117]
    [98]; the matrix's D4→D2 dependency, with the mechanism now cited (synthesis).
  grade: regulation
  legacy: [h-D4, h-D2]
  sources: [98, 117]

- id: k-039
  from: c-total-comp-gap-vs-large-employers
  to: c-counteroffer-and-withdrawal
  relation: amplifies
  link: 'a weaker package is easier to counter'
  evidence: >
    Benefits are 30 percent of compensation [104] and arrangements are priced by workers at 8 to 20 percent of wages [115];
    13 percent of cleared professionals switched for pay in a year [89]; a candidate comparing packages between acceptance
    and start has more to gain by withdrawing when the gap is wide (synthesis).
  grade: observational
  legacy: [h-D3, h-E7]
  sources: [89, 104, 115]

- id: k-040
  from: l-total-rewards-statement
  to: c-total-comp-gap-vs-large-employers
  relation: enables
  link: 'price the package the candidate is comparing'
  evidence: >
    Working conditions are a central part of compensation [94]; the WFH option is worth about 8 percent of wages and schedule
    predictability about 20 percent [115]; benefits are 30 percent of cost [104] and the family premium about $27,000 [105].
  grade: field-experiment
  legacy: [h-D3]
  sources: [94, 104, 105, 115]

- id: k-041
  from: l-post-and-state-negotiability
  to: c-offer-process-exposure
  relation: enables
  link: 'one sentence closes the negotiation gap'
  evidence: >
    Stating that pay is negotiable removed the gender gap in who negotiates in a field experiment with nearly 2,500 applicants
    [95]; posting laws raised wages 1.3 to 3.6 percent without reducing postings [97].
  grade: field-experiment
  legacy: []
  sources: [95, 97]

- id: k-042
  from: l-post-and-state-negotiability
  to: c-posting-draws-wrong-applicants
  relation: enables
  link: 'the posted range is the applicant-count lever'
  evidence: >
    Within a title, a higher posted wage draws more applicants [65]; disclosure rose 30 points under posting laws [97].
  grade: observational
  legacy: [h-A6]
  sources: [65, 97]

- id: k-043
  from: l-internal-equity-review-before-offer
  to: c-new-hire-pay-compresses-incumbents
  relation: enables
  link: 'see the compression before it happens'
  evidence: >
    The external premium and its performance cost are measurable before the offer [93]; the Equal Pay Act fixes the direction
    of any cure [112].
  grade: observational
  legacy: [h-D4]
  sources: [93, 112]

- id: k-044
  from: l-rate-relief-request
  to: c-contract-rates-lag-market
  relation: enables
  link: 'use the window, bring the evidence'
  evidence: >
    The schedule clause allows three increases a period inside a window with a ten percent approval threshold [117]; the ECI
    and CALC+ supply the evidence [103] [111].
  grade: regulation
  legacy: [h-D2]
  sources: [103, 111, 117]

- id: k-045
  from: l-bonus-under-established-plan
  to: c-counteroffer-and-withdrawal
  relation: enables
  link: 'a lawful closer, unmeasured'
  evidence: >
    Four in five organisations use sign-on bonuses and one in eight evaluates them [118]; allowable on cost-type contracts only
    under a pre-existing plan [100]. The link is practice, not evidence of effect (synthesis).
  grade: practitioner-survey
  legacy: [h-E7]
  sources: [100, 118]

- id: k-046
  from: l-bonus-under-established-plan
  to: c-new-hire-pay-compresses-incumbents
  relation: trade-off
  link: 'a visible sign-on bonus is a relative-pay signal'
  evidence: >
    Below-median earners who learn of peers'' pay lose satisfaction and search more [92]; a sign-on bonus incumbents did not
    receive is such a signal (synthesis).
  grade: field-experiment
  legacy: [h-D4]
  sources: [92]

- id: k-047
  from: l-key-personnel-contingent-offer-protocol
  to: c-key-personnel-contingency
  relation: enables
  link: 'disclose, document, keep in touch'
  evidence: >
    GAO requires notice of known unavailability and treats the proposal as unacceptable otherwise [108]; declarations of
    availability have defeated dismissals [114]; the COFC requires only a reasonable belief at submission absent a solicitation
    term [109].
  grade: regulation
  legacy: [h-C4, h-H2]
  sources: [108, 109, 114]

- id: k-048
  from: c-key-personnel-contingency
  to: c-counteroffer-and-withdrawal
  relation: amplifies
  link: 'a contingent start is a long wait'
  evidence: >
    Earlier offers are accepted more often [15]; a candidate held for an award date the firm does not control has every reason
    to keep looking (synthesis from [15] [108]).
  grade: observational
  legacy: [h-C4, h-E7]
  sources: [15, 108]

- id: k-049
  from: l-fast-decision-and-offer
  to: c-counteroffer-and-withdrawal
  relation: enables
  link: 'speed is the one offer-stage lever with field evidence'
  evidence: >
    Earlier post-interview offers were more often accepted with no later performance or turnover difference [15].
  grade: observational
  legacy: [h-E7, h-E2]
  sources: [15]

- id: k-050
  from: l-salary-history-compliance
  to: c-offer-process-exposure
  relation: enables
  link: 'remove the anchor the law removed'
  evidence: >
    Bans in about twenty states [106]; the early bans raised the gender earnings ratio by about 1 percent [96]; prior pay is
    no defence in the Ninth Circuit [116].
  grade: quasi-experimental
  legacy: []
  sources: [96, 106, 116]

# ---- clear-start stage (sweep 4, 2026-10-21) ----
- id: k-051
  from: c-sponsorship-needs-contract-and-fcl
  to: c-clearance-clock-exceeds-vacancy-window
  relation: precondition
  link: no request without a need; the clock starts at the request
  evidence: >
    A request needs access essential to a classified contract and a facility clearance behind it [119] [120]; until it is
    submitted no investigation runs, and once it is the firm influences only the initiation phase [126].
  grade: regulation
  legacy: [h-C1, h-C2]
  sources: [119, 120, 126]
- id: k-052
  from: c-clearance-clock-exceeds-vacancy-window
  to: c-long-interval-loses-accepted-hires
  relation: amplifies
  link: a longer clock is a longer interval
  evidence: >
    The clearance sets the interval between acceptance and start at 197 to 243 days [126], and each additional week of that
    interval raised the odds of a no-show by 22 percent in the one field study [144].
  grade: observational
  legacy: [h-C2, h-C4]
  sources: [126, 144]
- id: k-053
  from: c-long-interval-loses-accepted-hires
  to: c-counteroffer-and-withdrawal
  relation: amplifies
  link: the wait is when the other offer arrives
  evidence: >
    Thirty-nine percent of hires who never started had taken another job and an external offer raised the odds of leaving
    (OR 1.18) [144]; the offer-stage record carries the counteroffer side [113].
  grade: observational
  legacy: [h-C4, h-E7]
  sources: [113, 144]
- id: k-054
  from: l-bridge-work-plan
  to: c-long-interval-loses-accepted-hires
  relation: enables
  link: paid work in the interval keeps the hire
  evidence: >
    Financial security lowered the odds of a no-show (OR 0.86) and pay was the second reason given for leaving [144]; whether
    paid bridge work reproduces that effect has not been studied (synthesis).
  grade: observational
  legacy: [h-C4]
  sources: [144]
- id: k-055
