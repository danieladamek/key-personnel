  name: Alabama Labor Market Information (Department of Workforce LMI Division)
  kind: data-source
  what: The LMI Division publishes OEWS-based occupational wage estimates by area, including a Huntsville, AL table, along with LAUS unemployment, CES employment, and statewide and regional long-term (2022–2032) and short-term (2022–2024) occupational projections [265]. The home page's dated update lines on 2026-10-22 read 'October 16, 2026 - September Unemployment Statistics', 'October 16, 2026 - Current Employment Statistics updated' and 'August 13, 2026 - Occupation Wages Updated to 2nd Quarter 2026' [265]. The Huntsville wage PDF served on 2026-10-22 was the June 2025 edition, built from the May 2024 OEWS survey aged with ECI factors in cooperation with BLS [265]. The long-term projections book (November 2024) gives statewide Software Developers 16,860 in 2022 to 20,120 in 2032, +19.34%, with 1,305 annual openings, and Industrial Engineers 7,120 to 8,570, +20.41% [265].
