- id: al-jobs-act
  name: Alabama Jobs Act (Jobs Credit and Investment Credit)
  kind: program
  what: The Alabama Jobs Act, Ala. Code §§ 40-18-370 through 40-18-383, provides two incentives to approved companies with qualifying projects [258]. The Jobs Credit is a cash rebate of up to 3% annually of the previous year's gross payroll, excluding fringe benefits, for up to 10 years; the rate rises to up to 4% for Targeted or Jumpstart County projects, Technology Companies and qualifying pharmaceutical, biomedical and medical technology projects, with a further 0.5% where the eligible workforce is at least 12% veterans or the project sits within a BRAC-closed former installation [258]. The statute applies the jobs credit against utility taxes paid [260]. The Investment Credit is up to 1.5% annually of qualified capital investment for up to 10 years, or 15 in a Targeted or Jumpstart County, with a five-year carry-forward and transfer of the first five years at not less than 85% of face value with the Governor's approval [258]. The original 2015 act set a 3% jobs credit and a 1.5% investment credit over 10 years [259]; the 2023 Enhancing Economic Progress Act (HB241) added the enhanced rates, the 10-employee thresholds and a cap schedule rising to $475,000,000 for calendar 2027 [260].
  cost: no cost stated; the incentives are a payroll rebate and a tax credit [258]
  conditions: Net new full-time job thresholds are 50 in Non-Targeted/Non-Jumpstart counties, 10 in a Targeted or Jumpstart County, 10 for a Technology Company, and any number for chemical manufacturing, data centers, renewable energy generation, engineering/design/research, and metal/machining technology or toolmaking [258]. A Targeted or Jumpstart County project also involves at least $2,000,000 of direct or indirect investment [260]. Under § 40-18-382 as amended in 2023, the incentives are unavailable to projects whose project agreements are not executed on or prior to July 31, 2028; projects with executed agreements keep them [260]. Madison County is not listed as Targeted or Jumpstart in the Commerce summary [258]. The researcher found no 5-job threshold in any primary text (synthesis).
