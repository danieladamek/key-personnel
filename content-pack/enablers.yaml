- id: al-employer-childcare-credit
  name: Alabama employer childcare tax credit (Act 2024-303)
  kind: program
  what: Act 2024-303 (HB358) creates an employer tax credit equal to 75 percent of eligible childcare expenses, or 100 percent for a small business, defined as an employer with fewer than 25 employees, capped at $600,000 per employer per year [267]. Aggregate caps are $15,000,000 for 2025, $17.5 million for 2026 and $20 million for 2027 [267]. ADOR rule 810-3-135-.05, effective 2025-03-17, awards credits on a first-come, first-served basis until the annual aggregate is reached, reserves at least 25 percent for small businesses or employers headquartered in rural areas, opens reservations through My Alabama Taxes from March 1, 2025, and sets claims due by March 1 each year starting 2026 [267]. The same act creates a separate Childcare Facility Tax Credit for licensed for-profit providers, with per-child credits of $1,000–$2,000 by Quality STARS rating, $25,000 per facility and $5M statewide [267].
  cost: a tax credit; reservation through My Alabama Taxes, no fee stated [267]
  conditions: The credit applies to tax years beginning on or after January 1, 2025 and ending December 31, 2027, with the act effective January 1, 2025 [267]. Employers who do not secure a credit reservation do not qualify to claim the credit [267]. The OCR'd act PDF has scan errors; the figures here follow the rule text [267].
