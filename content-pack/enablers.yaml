  kind: program
  what: The Alabama Technology Network is part of the Alabama Community College System and serves as the Manufacturing Extension Partnership affiliate for Alabama, having served Alabama manufacturers since 1996 [264]. NIST's center page states that ATN provides technical assistance and customized training through local offices at 15 community colleges and 3 research universities, and reports FY2024 impacts of 3,375 jobs created or retained and $78,149,218 in cost savings [264]. ATN's own site describes it as the leading provider of training and technical assistance solutions for industry in Alabama, with workshop tracks in Lean Manufacturing, Environmental Health & Safety, Quality Systems & Engineering, Industrial Maintenance, Human Resources & Organizational Development, and Leadership & Management Development; it has been ISO 9001:2015 certified since 2008 [264].
