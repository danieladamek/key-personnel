- id: al-aidt
  name: AIDT (Alabama Industrial Development Training)
  kind: program
  what: AIDT is the state's industrial training agency, a division of the Alabama Department of Commerce, whose mission is to provide quality workforce development for Alabama's new and expanding businesses [255]. Its statute, Ala. Code §§ 41-29-280 to 41-29-286 as created by HB554 (2015), places it under the supervision of the Secretary of Commerce and funds it from the Education Trust Fund [256]. The services page lists pre-employment selection and training, leadership development, on-the-job training, and continuous improvement, maintenance and industrial safety assessments, delivered by AIDT staff or contracted instructors in classrooms or through 38 Mobile Training Units set up on the employer's site [255]. A companion Commerce page describes selection as a rigorous screening and interview process in which job seekers must meet employer criteria to be accepted for training [255]. The 2024 Workforce Transformation Act left AIDT in Commerce when other workforce programs moved to the new Department of Workforce, and renamed Commerce's Workforce Development Division the Alabama Industrial Development and Training Institute [266]. The Alabama Robotics Technology Park in Tanner is an AIDT training facility; see al-robotics-technology-park [257].
  cost: no cost to employers or trainees, as stated on the AIDT homepage and about page [255]
  conditions: The AIDT site serves 'new and expanding businesses' and states no size threshold, industry restriction, wage floor, exclusion list or statutory citation [255]. Job seekers are accepted for training only when they meet the employer's criteria [255]. The site does not mention the Alabama Office of Apprenticeship or the Alabama Workforce Training Center [255].
