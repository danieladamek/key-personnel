- id: al-innovate-alabama-sbir-match
  name: Innovate Alabama SBIR/STTR Supplemental Grant Program
  kind: program
  what: Innovate Alabama's Supplemental Grant Program provides a state match of 50% of a federal SBIR or STTR award, up to $100,000 for a Phase I award and up to $250,000 for a Phase II award, with no equity taken [261]. Permitted uses listed on the program page include 'Highly Skilled New Hires', business plan development, product testing, market research, IP protection and technical work [261]. Innovate Alabama describes itself as Alabama's first statewide public-private partnership focused on entrepreneurship, technology and innovation; the Alabama Innovation Commission was established in July 2020 and the board appointed in December 2021 [261]. The organisation's separate Tax Credit Program serves nonprofit economic development organizations and their donors under Ala. Code §§ 41-10-842 and 41-10-844, with $25 million allocated per fiscal year and a sunset of July 31, 2028 [261].
  cost: a grant; no fee stated [261]
  conditions: An active Phase I or Phase II federal SBIR or STTR award is required; businesses without federal SBIR/STTR funding are 'not eligible' [261]. On 2026-10-22 the page stated 'Applications are currently closed' and 'Stay tuned for details on upcoming rounds' [261]. The page does not state an Alabama-location requirement, application dates or a statutory basis [261]. No 'Growth credit', 'R&D credit' or employer hiring credit appears on the programs page [261].
