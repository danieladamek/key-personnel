- id: al-apprenticeship-credit
  name: Alabama Apprenticeship Tax Credit (expired 2024-12-31)
  kind: program
  what: 'ADOR''s page on the Alabama Apprenticeship Tax Credit, Ala. Code §§ 40-18-420 through 40-18-424, states: ''This credit expired on Dec. 31, 2024.'' [263]. While in force it provided $1,000 per qualifying apprentice, up to five apprentices, for tax years beginning 2017 through 2019, and $1,250 per qualifying apprentice, up to 10, for tax years beginning 2020 through 2024, with an additional credit of up to $500 per apprentice aged 18 or younger [263]. Act 2019-506 set the $1,250 rate, required the apprentice to be employed for at least seven full months of the prior taxable year, and capped the aggregate at $7,500,000 annually [263]. The credit was nonrefundable, nontransferable, without carry-forward, applied against income tax and financial institution excise tax, and unavailable for an individual apprentice for more than four taxable years [263]. Eligibility rested on a written apprenticeship agreement registered with the U.S. DOL Office of Apprenticeship, reviewed by the Alabama Office of Apprenticeship, and the credit was claimed through My Alabama Taxes [263].'
  cost: expired; a nonrefundable credit while in force [263]
  conditions: The credit covered tax years beginning on or after 2017-01-01 through 2024-12-31 and expired on December 31, 2024 [263]. No statewide extension or replacement credit for tax years 2025 onward was found on ADOR or ALISON as of 2026-10-22 [263]. ADOR's resource list includes a file named 'Act-2023-539-Repealing-Apprenticeship.pdf' whose effect the page does not explain [263]. The Alabama Office of Apprenticeship, which Act 2019-506 placed under Commerce's Workforce Development Division, was transferred to the Department of Workforce by SB247 (2024) [263] [266] (synthesis).
  levers:
