- id: al-dow-employer-services
  name: Alabama Department of Workforce employer services (Career Centers, OJT, WOTC, veterans)
  kind: program
  what: 'The Department of Workforce''s employer pages describe recruiting assistance through an employer dashboard in the Workforce Alabama system: finding and reviewing candidates, managing job listings and viewing active applications, plus labor market services drawn from résumés and job orders in that system [262]. Under WIOA On-the-Job Training, employers of OJT participants may be reimbursed for a portion of wages, up to 75% of hourly wages based on employee count, for a training period not exceeding six months [262]. The pages note that employers can receive the federal Work Opportunity Tax Credit for hiring job seekers who have faced employment barriers [262]. The legacy Career Centers page lists 52 One-Stop Career Centers and satellites offering job listings and résumé searches, pre-employment screening, interview space, and a Rapid Response Team that meets on-site after a plant closing or substantial layoff notice [262]. For veterans, a Local Veterans'' Employment Representative runs résumé searches for new openings, registered veterans receive a daily email of local openings, veterans and eligible spouses receive priority of service, and the HIRE Vets Medallion is a voluntary recognition program for employers that recruit, employ and retain veterans [262].'
  cost: no fees stated on any employer page [262]
  conditions: The pages address Alabama employers of any size using the state Employment Service [262]. 'Alabama JobLink' is not named on the current employer pages; the job bank is referred to as the Workforce Alabama system [262]. The Career Centers page still attributes Rapid Response to the Department of Commerce Workforce Development Division, whose workforce programs other than AIDT were transferred to the Department of Workforce by SB247 (2024) [262] [266] (synthesis).
  levers:
