- id: al-robotics-technology-park
  name: Alabama Robotics Technology Park (AIDT)
  kind: program
  what: The Alabama Robotics Technology Park is an AIDT training facility at 6505 U.S. Hwy 31, Tanner, AL 35671 [257]. Its site lists a Robotics and Automation Training Center, an Advanced Research & Development Center with dedicated space for organizations doing R&D on robot and automation technologies, an Automation and Advanced Manufacturing Training Center, an EV Technology Center, a Mobile Robotics Training Lab, and a Military Transition Program that connects transitioning military members, veterans and their spouses with training [257]. A 2019 AIDT news item states the park is not part of Calhoun Community College [257].
  cost: no cost to the company or the employee for Alabama business clients [257]
  conditions: Services go to Alabama business clients; the site states no size thresholds, industry limits or statute and refers companies to a 'Become A Client' page [257]. The AIDT homepage, about and services pages do not mention the park [255].
