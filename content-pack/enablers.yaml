- id: al-drug-free-workplace-discount
  name: Drug-Free Workplace Program premium discount (Alabama)
  kind: program
  what: A workers' compensation premium discount for an employer whose drug-free workplace program is certified by the Workers' Compensation Division as in full compliance with Code of Alabama §§ 25-5-330 through 25-5-340 [242]. The statute sets the discount at five percent, continuing not more than four years, with certification required each year [241].
  cost: no fee stated on the agency page; certification applications (first-year and subsequent-year forms dated 2023-11-01) [242]
  conditions: 'Five required elements: written policy statement, substance abuse testing, employee assistance resources, employee education and supervisor training [242]. The discount is pro rata from the certification date, lasts up to four years, and afterwards depends on experience rating [242]. Employers without a testing program on July 1, 1996 must let at least 60 days elapse between a general notice to all employees and the start of testing [241]. Participation is voluntary; the article does not mandate drug testing by Alabama employers generally [241].'
