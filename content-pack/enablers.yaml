- id: al-department-of-workforce
  name: Alabama Department of Workforce (formerly Department of Labor) and the 2024 Working for Alabama acts
  kind: reference
  what: SB247 (2024), the Alabama Workforce Transformation Act, renames the Alabama Department of Labor the Alabama Department of Workforce, headed by a Secretary of Workforce [266]. Section 13 makes the act effective October 1, 2024 and section 12 requires full implementation not later than October 1, 2025; the Governor's release of 2025-01-31 states that on February 1, 2025 the Department of Labor officially becomes the Department of Workforce [266]. The act transfers Commerce's workforce programs, including WIOA Title I, the Alabama Office of Apprenticeship, the Alabama STEM Council and the Office of Education and Workforce Statistics, to the new department, excepting the Alabama Industrial Development Training Institute, and creates the Alabama Workforce Board of no more than 40 members with seven regional boards [266]. The department retains workplace safety, child labor enforcement, unemployment, workers' compensation and labor market information [266]. Companion 2024 enrolled bills include SB252, the Alabama Growth Alliance Act, and SB253, the Alabama Workforce Pathways Act, a K-12 diploma pathway, both effective 2024-10-01 [266]; HB358, the employer childcare credit (see al-employer-childcare-credit) [267]; and HB346, the Alabama Workforce Housing Tax Credit (Act 2024-302), a housing-developer credit of up to $2 million per project for up to 10 years with no employer hiring or wage component [268].
  cost: n/a (reference record)
  conditions: The LMI site already carries the new name while legacy labor.alabama.gov pages still read Department of Labor or Commerce [265] [262] (synthesis). The SB247 enrolled PDF prints no act number [266]. The Workforce Pathways Act contains no employer-facing provision [266].
