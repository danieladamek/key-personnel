- id: doj-ier-export-control-fact-sheet
  name: DOJ Civil Rights Division employer fact sheet on export controls and immigration-related discrimination
  kind: reference
  what: >
    The Immigrant and Employee Rights Section's fact sheet (rev. March 2024): U.S. persons are citizens, nationals,
    permanent residents, refugees and asylees; the fact sheet tells employers not to tell applicants that the export rules
    require a citizenship, to assess only the positions that work with controlled items, to keep the assessment separate
    from Form I-9 without limiting document choice, and to apply to State or Commerce for authorization for a non-U.S.
    person [131]. Read in sweep 1 through a law-firm summary [51]; the primary was read in sweep 4.
  cost: 'free [131]'
  conditions: 'none; the fact sheet is guidance, with the enforcement record behind it [49] [50]'
  levers: [l-conditional-offer-sequencing, l-start-date-compliance-sequence]
  official_url: https://www.justice.gov/crt/media/1287536/dl
  pending_changes: []
  as_of: '2026-10-21'
  sources: [49, 50, 51, 131]

