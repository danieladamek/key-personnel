# enablers.yaml — Key Personnel · data sources, programs, references, standards and tooling categories, each as its owner states it. Sweep 1: select.
# No vendor is recommended; tooling records name a category and list examples by the vendors' own descriptions (added in sweep 8).
- id: opm-structured-interview-guide
  name: OPM Structured Interview Guide and resources
  kind: reference
  what: >
    The U.S. Office of Personnel Management's definition of a structured interview (same predetermined questions in the same
    order, scored on the same rating scale; behavioural and situational question types) with a linked Structured Interview
    Guide, a presentation, a webcast, a training video and a sample question with rating scale [41].
  cost: 'free, public domain [41]'
  conditions: 'written for federal hiring; usable by any employer (synthesis)'
  levers: [l-structured-interview, l-interviewer-training]
  official_url: https://www.opm.gov/policy-data-oversight/assessment-and-selection/structured-interviews/
  pending_changes: []
  as_of: '2026-10-21'
  sources: [41]

- id: google-rework-structured-interviewing
  name: Google re:Work guide to structured interviewing
  kind: reference
  what: >
    A large employer's published template: four components (vetted questions, full feedback recording, standardised rubrics
    with poor/borderline/solid/outstanding anchors, interviewer training and calibration), attributes in three areas, and
    company-reported results stated without methods (about 40 minutes saved per interview; rejected candidates 35 percent
    happier) [42].
  cost: 'free [42]'
  conditions: 'a practitioner template, not evidence of effect; the figures are the company''s own claims [42]'
  levers: [l-structured-interview, l-interviewer-training, l-interview-plan-and-preview]
  official_url: https://rework.withgoogle.com/intl/en/guides/a-guide-to-structured-interviewing-for-better-hiring-practices
  pending_changes: []
  as_of: '2026-10-21'
  sources: [42]

