  summary: >
    How applicants see the process matters for whether they stay in it: positive perceptions of selection predict organisational
    attractiveness, intention to accept an offer and willingness to recommend the employer, while being almost unrelated to
    gender, age and ethnicity. Interviews and work samples are the best-liked procedures, cognitive tests sit in the middle, and
    personality, honesty tests, biodata and graphology are least liked. Face validity and perceived predictive validity drive
