  citation: Alabama Legislature. Code of Alabama 1975, § 25-1-30, Clarke-Figures Equal Pay Act (Act 2019-519, §§ 1, 2). Laws through the 2026 Regular Session; text read on the syfert.com mirror of ALISON. Alabama Legislature (ALISON) text; syfert.com mirror, n.d.
  url: https://syfert.com/alabama/sections/25-1-30.html
