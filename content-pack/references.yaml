  population: Contracts restraining trade in Alabama; agents, servants or employees of a commercial entity; sellers of business goodwill; partners or owners on dissolution
  effect: ''
  read: full
  summary: Alabama's restrictive-covenant statute. § 8-1-190(a) voids contracts restraining a lawful profession, trade or business except as the section allows; (b) lists permitted covenants with presumptively reasonable durations. § 8-1-191 lists protectable interests and says job skills alone are not one. § 8-1-194 puts the burden of proof on the enforcing party, and § 8-1-197 declares the article fundamental public policy.
  key_facts:
  - '§ 8-1-190(b)(4): an agent, servant or employee may agree with a commercial entity to refrain from carrying on a like business in a specified area; restraints of two years or less are presumed reasonable.'
  - '§ 8-1-190(b)(5): an employee may agree not to solicit current customers; restraints of 18 months, or as long as post-separation consideration is paid, whichever is greater, are presumed reasonable.'
  - '§ 8-1-190(b)(3): a seller of business goodwill may agree not to compete; one year or less is presumed reasonable.'
  - '§ 8-1-191(a): protectable interests are trade secrets, confidential information, commercial relationships with specific customers, goodwill, and specialized training involving substantial expenditure set out in writing as consideration; § 8-1-191(b): job skills alone are not protectable.'
  - The statute contains no wage or salary threshold, no notice period, no garden-leave provision and no employee-income floor.
  quotes:
  - "Restraints of two years or less are presumed to be reasonable. (§ 8-1-190(b)(4))"
  - "Job skills in and of themselves, without more, are not protectable interests. (§ 8-1-191(b))"
  - "The party seeking enforcement of the covenant has the burden of proof on every element. (§ 8-1-194)"
  - "Nothing in this article shall be construed to eliminate any professional exemption recognized by Alabama law. (§ 8-1-196)"
