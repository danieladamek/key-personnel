  effect: 'testing raised median tenure by more than 10 percent with no measurable change in minority hiring; gains were roughly uniform across groups'
  read: partial
  summary: >
    A natural experiment on whether adding a standardised test trades equity for efficiency. Minorities scored lower on the test,
    yet testing did not reduce minority hiring, and the productivity gains (tenure up more than 10 percent) were spread evenly
    across groups. The authors read this as the test replacing an informal screen that was no less biased, so the test added
    precision without adding negative information about minority applicants.
