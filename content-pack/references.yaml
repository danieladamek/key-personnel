  key: FAR-31-205-6
  tier: background
  tier_note: 'governing text or official guidance; carried as background because the seminal tier is reserved for the landmark studies the guide rests on (consolidation, 2026-10-22)'
  citation: 'Federal Acquisition Regulation 31.205-6, Compensation for personal services. acquisition.gov.'
  url: https://www.acquisition.gov/node/30667/printable/pdf
  journal: ''
  year: 2026
  published: unknown
  date_note: current text as of access
  accessed: '2026-10-21'
  publisher: General Services Administration (acquisition.gov)
  source_kind: primary
  peer_reviewed: false
  study_design: regulation
  population: 'contractors recovering compensation costs under cost-based contracts'
  effect: 'compensation allowable if reasonable for the work and conforming to an established plan; reasonableness judged against firms of similar size, industry and area doing similar non-government work; no presumption of allowability for major plan changes made without ACO review; bonuses allowable only under an agreement or plan established before the services; costs above the OFPP benchmark (41 U.S.C. 1127; all employees for awards on or after June 24, 2014) unallowable'
  read: full
  summary: >
    The cost principle that governs what a cost-type contractor can recover in pay: the salary must be reasonable by comparison
    with similar firms, a sign-on or retention bonus is allowable only under a plan that existed before the work, major
    compensation-plan changes need the administrative contracting officer's chance to review, and the all-employee cap applies.
    The cap rarely binds a small firm's technical hires but the plan and bonus rules bind every offer (synthesis).
  key_facts:
  - 'Reasonableness: comparison with firms of the same size, industry, geographic area and type of work (b)'
  - 'Bonuses allowable only under a pre-existing agreement or plan (f); severance limited (g); pension supplements limited (j)'
  - 'Cap: benchmark set by OFPP under 41 U.S.C. 1127; applies to all employees on awards from 2014-06-24 (p)(4); narrow exceptions for scientists and engineers possible'
  quotes:
  - 'No presumption of allowability will exist'
  role_here: data-source
  role_note: the allowability gate on offers and bonuses
  cited_in: ["3-pay-in-a-rate-constrained-firm"]
