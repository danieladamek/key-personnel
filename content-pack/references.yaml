- n: 1
  key: Sackett2022
  tier: seminal
  citation: 'Sackett, P. R., Zhang, C., Berry, C. M., & Lievens, F. (2022). Revisiting meta-analytic estimates of validity in personnel selection: Addressing systematic overcorrection for restriction of range. Journal of Applied Psychology, 107(11), 2040–2068.'
  url: https://www.Gwern.net/doc/statistics/meta-analysis/2021-sackett.pdf
  doi: 10.1037/apl0000994
  journal: Journal of Applied Psychology
  year: 2022
  published: '2022'
  accessed: '2026-10-21'
  publisher: American Psychological Association (accepted manuscript mirrored on gwern.net)
  source_kind: primary
  peer_reviewed: true
  study_design: meta-analysis
  population: 'US and international civilian job samples pooled from prior meta-analyses; e.g. structured interviews k = 36 / N = 3,069 (McDaniel 1994) and k = 69 / N = 4,795 (Huffcutt 2014); job knowledge k = 59 / N = 3,965; biodata k = 49 / N = 20,564; work samples k = 54 / N = 10,469'
  effect: 'revised operational validities: structured interviews .42, job knowledge .40, empirically keyed biodata .38, work samples .33, cognitive ability .31, integrity .31, assessment centers .29, SJT (knowledge) .26, interests .24, unstructured interviews .19, conscientiousness .19, years of experience .07'
  read: full
  summary: >
    Re-estimates the validity of the main selection procedures after showing that prior meta-analyses applied range-restriction
    corrections derived from predictive studies to the concurrent studies that dominate the databases, which overcorrected. The
    authors recommend no range-restriction correction for concurrent studies; the revised estimates fall by .10–.20 but the rank
    order of the strong predictors largely holds, with structured interviews now first and cognitive ability well down the list.
    Each validity is paired with a Black–White d so that the validity–diversity trade-off is visible: cognitive ability d = .79,
    work samples .67, job knowledge .54, structured interviews .23, integrity .10.
  key_facts:
  - 'Structured interviews .42 (was .51 in Schmidt & Hunter 1998); job knowledge .40 (was .48); biodata .38 (was .35); work samples .33 (was .54); cognitive ability .31 (was .51); unstructured interviews .19 (was .38); years of job experience .07 (was .18)'
  - 'Black–White d: cognitive ability .79; work samples .67; job knowledge .54; assessment centers .52; years of experience .49; SJT .39; biodata .33; interests .33; unstructured interviews .32; structured interviews .23; integrity .10; conscientiousness −.07'
  - 'Recommendation: apply no range-restriction correction to concurrent (incumbent) validation studies; hiring-rate-based U ratios are unreliable'
  - 'The d values mix applicant, incumbent and national samples and are offered to locate predictors as having large, modest or minimal group differences'
  quotes:
  - 'we recommend no range restriction correction for concurrent studies'
  why_it_mattered: "Reset the field's numbers: after the 2022 re-estimation, structured interviews rather than cognitive tests lead the validity table, and every method's group difference sits beside its validity, so the trade-off is visible in one table."
  role_here: prior-result
  role_note: the current standard for what predicts job performance; anchors the select stage and the cognitive-ability controversy
  cited_in: ["1-what-predicts-a-good-hire", "11-how-the-evidence-was-gathered", "2-where-candidates-come-from", "7-planning-the-workforce", "8-the-controversies", "abstract", "ledger-outcomes", "stage-map", "validity-2022"]
  used_by: ["concepts/how-this-guide-fits-together", "concepts/reading-an-effect-size", "concepts/what-predicts-performance", "constraints/c-degree-requirement-shrinks-pool", "constraints/c-firm-and-customer-define-qualified-differently", "constraints/c-keyword-screen-rejects-qualified", "constraints/c-technical-interview-measures-anxiety", "constraints/c-unstructured-judgement", "constraints/c-validity-diversity-tradeoff", "controversies/cognitive-ability-validity", "controversies/skills-based-hiring", "glossary/assessment-center", "glossary/biodata", "glossary/cognitive-ability-test", "glossary/correlation-coefficient", "glossary/criterion-related-validity", "glossary/degree-requirement", "glossary/effect-size", "glossary/essential-requirement", "glossary/integrity-test", "glossary/job-analysis", "glossary/job-knowledge-test", "glossary/k-and-n", "glossary/mechanical-combination", "glossary/meta-analysis", "glossary/operational-validity", "glossary/personality-test", "glossary/range-restriction", "glossary/situational-judgment-test", "glossary/skills-based-hiring", "glossary/structured-interview", "glossary/subgroup-difference", "glossary/technical-interview", "glossary/unstructured-interview", "glossary/validation-study", "glossary/work-sample-test", "hypotheses/h-A2", "hypotheses/h-B3", "hypotheses/h-B5", "hypotheses/h-E3", "hypotheses/h-cat-B", "hypotheses/h-pattern-p1", "hypotheses/h-pattern-p2", "levers/l-affirmative-skill-filters", "levers/l-interview-plan-and-preview", "levers/l-mechanical-scoring", "levers/l-pipeline-record-and-evidence-review", "levers/l-private-or-collaborative-technical-assessment", "levers/l-requisition-scorecard-with-customer", "levers/l-skills-based-requirements", "levers/l-structured-interview", "levers/l-work-sample-or-knowledge-test", "links/k-001", "links/k-003", "links/k-008", "links/k-009", "links/k-010", "links/k-027", "links/k-124", "patterns/customer-rejects", "patterns/few-plausible-candidates", "patterns/many-apply-few-qua