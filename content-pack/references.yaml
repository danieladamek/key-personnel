- n: 60
  key: Burks2013-IZA7382
  tier: seminal
  citation: 'Burks, S. V., Cowgill, B., Hoffman, M., & Housman, M. (2013). You''d be perfect for this: Understanding the value of hiring through referrals. IZA Discussion Paper 7382. Published as "The value of hiring through employee referrals", Quarterly Journal of Economics, 130(2), 805–839 (2015).'
  url: https://epflicht.ulb.uni-bonn.de/download/pdf/103985
  doi: 10.1093/qje/qjv010
  journal: Quarterly Journal of Economics (working-paper version read)
  year: 2015
  published: '2013-05'
  accessed: '2026-10-21'
  publisher: IZA (PDF via the University of Bonn deposit library)
  source_kind: primary
  peer_reviewed: true
  study_design: quasi-experimental
  population: 'nine large firms in three industries: seven call-centre firms (≈350,000 applicants, 50,000 employees, 2008–2012), one trucking firm, one high-tech firm (≈1.18 million applicants, 25,000 employees, 2003–2008)'
  effect: 'referred applicants substantially more likely to be hired; referred workers 10–30% less likely to quit (≈13% call centres, 12% trucking, 30% high-tech); little difference on most productivity measures; trucking referred drivers ≈7% lower weekly accident risk; high-tech referred workers ≈20% more likely to file patents; trucking profit per worker $2,201 referred vs $1,756 non-referred'
  read: full
  summary: >
    The largest field study of referral hiring: across nine firms and three industries, referred applicants were more likely to
    be hired and, once hired, quit 10 to 30 percent less often, while being no more productive on the ordinary metrics; the
    gains showed up in rare, costly events (accidents, patents) and in retention. Referrals from above-median workers were worth
    far more ($4,190 of discounted profit in trucking) than those from below-median workers ($1,063, below the non-referred
    average). The working-paper version was read; the QJE pagination is from the citation.
  key_facts:
  - 'Quit rates: referred workers ≈13% (call centres), ≈12% (trucking), ≈30% (high-tech) less likely to quit'
  - 'High-tech: referred workers ≈20% more likely to file patents, ≈24% more patents per worker; interview scores ≈0.16 SD higher'
  - 'Trucking: discounted profit per worker $2,201 referred vs $1,756 non-referred; referrer productivity matters ($4,190 vs $1,063)'
  quotes: []
  why_it_mattered: "The largest field study of referrals: referred hires quit less and cost less without being more productive, which is why the referral lever carries retention and cost, not quality."
  role_here: support
  role_note: the evidence behind referral programs and their limits
  cited_in: ["2-where-candidates-come-from", "ledger-outcomes"]
