  read: full
  summary: >
    GAO's current rule on the people named in a proposal: when a proposed key person leaves before award and the firm knows it,
    the firm must say so, and the proposal is then unacceptable unless discussions are reopened. For a recruiter it means a
    contingent hire named as key personnel has to be kept engaged through award, and a departure has to be disclosed; the Court
    of Federal Claims reads the duty more narrowly (n109).
