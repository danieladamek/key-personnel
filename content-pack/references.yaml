- n: 7
  key: Kuncel2013
  tier: seminal
  citation: 'Kuncel, N. R., Klieger, D. M., Connelly, B. S., & Ones, D. S. (2013). Mechanical versus clinical data combination in selection and admissions decisions: A meta-analysis. Journal of Applied Psychology, 98(6), 1060–1072.'
  url: https://Www.Gwern.net/doc/statistics/prediction/2013-kuncel.pdf
  doi: 10.1037/a0034156
  journal: Journal of Applied Psychology
  year: 2013
  published: '2013'
  accessed: '2026-10-21'
  publisher: American Psychological Association (PDF mirrored on gwern.net)
  source_kind: primary
  peer_reviewed: true
  study_design: meta-analysis
  population: 'job performance: k = 9; N = 1,392 (mechanical) and 1,156 (clinical)'
  effect: 'job performance validity r = .44 for mechanical combination vs .28 for holistic/clinical combination of the same predictors'
  read: full
  summary: >
    When the same predictor information is combined by formula rather than by judgement, prediction of job performance
    improves by more than half (r .44 vs .28). The authors conclude that experts are good at collecting information and poor at
    combining it, and recommend mechanical screening, mechanical scores as the anchor for any adjustment, documented
    deviations, and averaging across raters. Values are probably underestimates because no range-restriction or
    unreliability corrections were possible.
  key_facts:
  - 'Job performance: mechanical r = .44 (cross-validated .40) vs clinical r = .28; k = 9'
  - 'Recommended practice: screen mechanically; use the mechanical score as the anchor; document deviations; average raters'
  quotes:
  - 'consistent and substantial loss of validity when data were combined holistically'
  - 'data combination is best done mechanically while information collection can be done quite effectively by experts'
  why_it_mattered: "Turned a judgement question into a measured one: combining the same information by formula beats combining it by feel by more than half, which is the evidence behind scored rubrics and documented overrides."
  role_here: support
  role_note: the evidence behind scored rubrics and against gut-feel overrides
  cited_in: ["1-what-predicts-a-good-hire", "7-planning-the-workforce"]
