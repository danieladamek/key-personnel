  citation: 'Speer, A. B., Hardy, J. H., III, Gibson, C., Frost, C., & Hong, Q. (2026). Now you see them, now you don''t: Understanding new hire ghosting and its antecedents. Human Resource Management Journal. Read on a publisher-permitted copy hosted by HireVue.'
  url: https://www.hirevue.com/wp-content/uploads/2026/07/Human-Res-Mgmt-Journal-2026-Speer-Now-You-See-Them-Now-You-Don-t-Understanding-New-Hire-Ghosting-and-Its-2.pdf
  doi: 10.1111/1748-8583.70050
  journal: Human Resource Management Journal
  year: 2026
  published: '2026'
  accessed: '2026-10-21'
  publisher: 'Wiley'
  source_kind: primary
  peer_reviewed: true
  study_design: observational
  population: 'Study 1: 157,154 accepted entry-level offers at one large U.S./Canadian telecommunications company, May 2019–June 2025 (HRIS records); Study 2: 434 U.S. adults (205 recent ghosters, 229 non-ghosters) from a Prolific screen of 9,040'
  effect: 'ghosting rate 4.1% of accepted offers (peak 6.1% in April 2020); each additional week between offer acceptance and start date raised the odds of ghosting (b = 0.20, OR = 1.22, r = .11); employee referral OR 0.42; company communication quality OR 0.56; organizational attractiveness OR 0.57; financial security OR 0.86; external offers OR 1.18; impulsivity OR 2.05 (1.69 in the full model); reasons given by ghosters: alternate job 39%, pay 29%, negative company perception 24%, the work 23%, family or scheduling 17%, communication 14%'
  read: full
  summary: >
    The only field evidence found on what happens between acceptance and the first day. Among 157,154 accepted entry-level
    offers at one telecom employer, 4.1 percent never showed, and every extra week of waiting raised the odds by about a
    fifth. The survey study adds the protective factors: a referral, good communication from the company, attraction to the
    firm and financial security, against a competing offer and impulsivity. The population is entry-level and
    customer-facing, not cleared technical staff, so the rates do not transfer; the mechanism is what the pack carries.
  key_facts:
  - 'Each additional week from acceptance to start: OR 1.22 for ghosting (N = 157,154)'
  - 'Referral OR 0.42; communication quality OR 0.56; financial security OR 0.86; external offers OR 1.18'
  - 'Ghosters'' reasons: alternate job 39%, pay 29%, company perception 24%'
  quotes:
  - 'Hires with longer offer-to-start delays and customer-facing roles experienced greater ghosting risk.'
  - 'Shortening time between job offer and start date can reduce ghosting.'
  role_here: data-source
