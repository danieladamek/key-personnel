  - '§ 31-13-15(c)-(f): first violation — court-ordered termination of unauthorized workers, three-year probation with quarterly new-hire reports to the district attorney, sworn affidavit within three days, licenses at the location suspendable up to 10 business days; second — permanent revocation at that location; subsequent — statewide suspension.'
  - '§ 31-13-9(b): E-Verify enrollment documentation is a condition of any state, political-subdivision or state-funded contract, grant or incentive to an employer with one or more Alabama employees; (c) subcontractors must enroll before beginning work.'
