  effect: ''
  read: partial
  summary: The 2023 renewal of the Alabama Jobs Act. It moves the § 40-18-382 sunset from July 31, 2023 to July 31, 2028, codifies the 10-employee thresholds for targeted/jumpstart counties (§ 40-18-376.1) and technology companies (§ 40-18-376.3), the 4% enhanced jobs-credit rates, the 0.5% veterans add-on (§ 40-18-376.2), and raises the annual cap to $475,000,000 for calendar 2027. The Governor's 2023-04-20 release names the four bills as 'The Game Plan'. The enrolled PDF prints no act number.
  key_facts:
  - 'Short title (§1): ''This act shall be known and cited as the Enhancing Economic Progress Act.'' The Governor''s release calls it ''Enhancing Alabama''s Economic Progress Act''.'
  - '§ 40-18-382 as amended: incentives are not available for qualifying projects whose project agreements are not executed on or prior to July 31, 2028; projects with executed agreements keep their incentives.'
  - '§ 40-18-376.1(c): a targeted or jumpstart county project employs at least ten new employees and involves at least two million dollars.'
  - '§ 40-18-376.3(a)(3): technology company — at least 10 new employees at the qualifying project; § 40-18-376.3(b)(1) jobs credit up to 4 percent of wages paid.'
  - '§ 40-18-375(a)(1): standard jobs credit up to 3 percent of wages paid; § 40-18-376.2(b)(1): an additional 0.5 percent jobs credit for veterans.'
  - '§ 40-18-383(a): annual cap rises in $25 million steps to $475,000,000 for the calendar year ending December 31, 2027.'
  - Effective immediately on passage and approval (§6); the Governor's release dates the signing of the package to 2023-04-20.
  - '§ 40-18-375 heading reads ''against utility taxes'': the jobs credit is applied against utility taxes paid.'
  quotes:
  - "shall employ at least ten new employees and shall involve, directly or indirectly, at least two million dollars (§ 40-18-376.1(c))"
  - "The Game Plan will serve as our next-generation strategic economic development framework (governor.alabama.gov release 2023-04-20)"
