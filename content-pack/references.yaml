  summary: >
    The operating rules for the interview and the offer: before a conditional offer an employer may ask whether the applicant can
    perform job functions with or without accommodation, may ask for a demonstration if everyone in the category is asked, may
    ask about licences, attendance and arrest or conviction records, but may not ask disability-related questions or require
    medical exams. After a conditional offer the employer may ask anything medical if it asks everyone entering the job. A
    withdrawn offer must rest on job-relatedness and business necessity, or a direct threat for safety exclusions.
