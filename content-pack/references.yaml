  read: full
  summary: >
    The contract type that fixes what a salary can be: each labor category has a fixed hourly rate that already contains the
    wage, the indirect costs and the profit, so the affordable salary is what remains after the firm's indirect rates and
    margin are subtracted (the "wrap rate" arithmetic, a synthesis). The rate applies only to labor that meets the category's
    qualifications.
