  population: Alabama employers incurring eligible childcare expenses for employees; 'small business' = employer with fewer than 25 employees
  effect: ''
  read: partial
  summary: Act 2024-303 creates an employer tax credit equal to 75% of eligible childcare expenses (100% for a small business, defined as an employer with fewer than 25 employees), capped at $600,000 per employer per year, with aggregate caps of $15M (2025), $17.5M (2026) and $20M (2027), for tax years beginning January 1, 2025 through December 31, 2027. ADOR rule 810-3-135-.05 sets a first-come reservation process through My Alabama Taxes from March 1, 2025 and reserves at least 25% of credits for small businesses or rural-headquartered employers.
  key_facts:
  - '§2(17): small business is ''An employer that has fewer than 25 employees.'''
  - '§3(a): employer credit is 75 percent of eligible expenses; 100 percent for a small business; §2(9) per-employer cap $600,000 per year.'
  - '§3(b) aggregate caps: $15,000,000 for 2025; $17.5 million for 2026; $20 million for 2027.'
  - Applies to tax years beginning on or after January 1, 2025 and ending December 31, 2027; §8 effective January 1, 2025. Act number 2024-303 appears on the Secretary of State record reproduced in the ADOR PDF.
  - 'Rule 810-3-135-.05 (effective 2025-03-17): credits awarded first-come, first-served until the annual aggregate is reached; at least 25 percent reserved for small businesses or rural-headquartered employers; reservations from March 1, 2025; claims due by March 1 each year from 2026; employers without a reservation do not qualify.'
  - 'Companion Childcare Facility Tax Credit (§§ 40-18-540 to 546): per-child credits $1,000–$2,000 by Quality STARS rating, $25,000 per facility, $5M statewide, 2025–2027, for licensed for-profit providers.'
  - The OCR'd act PDF has scan errors; figures are as corrected by the rule text.
  quotes:
  - "An employer that has fewer than 25 employees. (Act 2024-303 §2(17))"
  - "All credits must be awarded on a first-come, first-served basis until the annual aggregate limit is reached. (Rule 810-3-135-.05)"
