    The directive that makes an existing clearance portable: a receiving agency accepts the investigation and the adjudication
    unless one of seven exceptions applies, must decide within five business days, and cannot withhold reciprocity because it
    wants a polygraph. The clock excludes the polygraph itself. Contractors are covered individuals.
