- n: 8
  key: Dana2013
  tier: classic
  citation: 'Dana, J., Dawes, R., & Peterson, N. (2013). Belief in the unstructured interview: The persistence of an illusion. Judgment and Decision Making, 8(5), 512–520.'
  url: https://dlab.sauder.ubc.ca/sjdm/journal/12/121130a/jdm121130a.html
  doi: 10.1017/S1930297500003612
  journal: Judgment and Decision Making
  year: 2013
  published: '2013-09'
  accessed: '2026-10-21'
  publisher: Society for Judgment and Decision Making (open access)
  source_kind: primary
  peer_reviewed: true
  study_design: field-experiment
  population: 'three laboratory studies with student interviewers predicting students'' GPA; Study 3 n = 169'
  effect: 'predictions made with an unstructured interview r = .31 vs .61 without one; prior GPA alone .65; 57% ranked a random interview above no interview'
  read: full
  summary: >
    Shows two mechanisms that keep the unstructured interview alive: sensemaking (interviewers form confident impressions even
    from random answers) and dilution (the interview degrades the use of valid information). Adding an interview halved
    predictive accuracy, interviewers could not tell random interviews from real ones, and most people still preferred a
    random interview to none. The authors conclude unstructured interviews should not be used for screening decisions.
  key_facts:
  - 'Study 1: predictions with interview r = .31; without r = .61; prior GPA alone r = .65'
  - 'Interviewers given random answers rated their impressions as useful as those given accurate answers'
  - 'Study 3: 96 of 169 (57%) ranked a random interview above no interview'
  quotes: []
  role_here: support
  role_note: why hiring teams keep trusting the method with the least validity
  cited_in: ["1-what-predicts-a-good-hire"]
