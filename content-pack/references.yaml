  read: full
  summary: >
    How criminal records may be used without disparate impact liability: a targeted screen on the nature of the offence, time
    elapsed and the job, paired with an individualised assessment in which the person can respond; blanket exclusions and
    arrest-only exclusions are the clearest violations. For cleared work it states that Title VII's national security exception
    applies only where the position is actually subject to federal security requirements and the action followed a clearance
    denial, and that exclusions beyond the federal requirement remain subject to Title VII.
  key_facts:
