  population: State of Alabama workforce agencies; Alabama employers and job seekers served by them
  effect: ''
  read: partial
  summary: The enrolled Alabama Workforce Transformation Act renames the Department of Labor the Alabama Department of Workforce with a Secretary of Workforce, creates the Alabama Workforce Board as the State Workforce Development Board and seven regional boards, and moves Commerce's workforce programs (WIOA Title I, the Alabama Office of Apprenticeship, the STEM Council, the Office of Education and Workforce Statistics) to the new department, excepting AIDT. Effective October 1, 2024; full implementation not later than October 1, 2025. The Governor's 2025-01-31 release states the name change officially took place February 1, 2025.
  key_facts:
  - '§1: ''This act shall be known and may be cited as the Alabama Workforce Transformation Act.'''
  - '§2: the Alabama Department of Labor is renamed the Alabama Department of Workforce; its head is the Secretary of Workforce.'
  - '§3, § 25-2-2(a)(26): Workforce administers all workforce development programs previously administered by Commerce except the Alabama Industrial Development Training Institute; transferred programs include the Alabama Office of Apprenticeship, the Alabama STEM Council and the Office of Education and Workforce Statistics.'
  - '§5, § 25-15-1: the Governor establishes the Alabama Workforce Board as the State Workforce Development Board; no more than 40 members; four-year Strategic Workforce Plan; seven regional workforce boards; §11 repeals the Alabama Workforce Council and Regional Workforce Development Councils.'
  - '§7: Commerce''s Workforce Development Division is renamed the Alabama Industrial Development and Training Institute; §9 keeps AIDT as a division of Commerce with a director appointed by the Secretary of Commerce.'
  - '§13: effective October 1, 2024; §12: fully implemented not later than October 1, 2025.'
  - 'Governor''s release 2025-01-31: on February 1, 2025 the Department of Labor officially becomes the Department of Workforce; the department retains workplace safety, child labor enforcement, unemployment, workers'' compensation and labor market information.'
  - 'Companion enrolled bills read on ALISON: SB252 (Alabama Growth Alliance Act, §§ 41-10-870 to 41-10-878, effective 2024-10-01) and SB253 (Alabama Workforce Pathways Act, a K-12 diploma pathway, effective 2024-10-01). Neither enrolled PDF prints an act number.'
  quotes:
  - "The Alabama Department of Labor is hereby renamed the Alabama Department of Workforce (SB247 enrolled, §2)"
  - "This act shall become effective on October 1, 2024, following its passage and approval by the Governor (SB247 enrolled, §13)"
  - "on February 1, 2025, the Alabama Department of Labor will officially become the Department of Workforce (governor.alabama.gov release 2025-01-31)"
