  summary: 'Commerce''s one-page summary of the Alabama Jobs Act as administered after the 2023 amendments. It gives the Jobs Credit (cash rebate up to 3% of prior-year gross payroll, 4% in enhanced cases, plus 0.5% for veterans) and the Investment Credit (up to 1.5% of qualified capital investment), their durations, and the net-new-job thresholds: 50 generally, 10 in Targeted or Jumpstart counties and for Technology Companies, and no fixed number for listed activities.'
  key_facts:
  - 'Statute cited: Sections 40-18-370 through 40-18-383 of the Code of Alabama 1975 (summary updated 03/25).'
  - 'Jobs Credit: cash rebate of up to 3% annually of the previous year''s gross payroll (excluding fringe benefits); up to 4% for Targeted or Jumpstart County projects, Technology Companies and qualifying pharmaceutical/biomedical/medical technology projects; an additional 0.5% where the eligible workforce is at least 12% veterans, and for projects within a BRAC-closed former installation.'
  - Jobs Credit available for up to 10 years.
  - 'Investment Credit: up to 1.5% annually of qualified capital investment; up to 10 years, or 15 in a Targeted or Jumpstart County; five-year carry-forward; first 5 years transferable at not less than 85% of face value with the Governor''s approval.'
  - 'Net new full-time job thresholds: 50 in Non-Targeted/Non-Jumpstart counties; 10 in Targeted or Jumpstart counties; 10 for a Technology Company; any number for chemical manufacturing, data centers, renewable energy generation, engineering/design/research, metal/machining technology or toolmaking.'
  - 'Capital investment threshold: none in Non-Targeted counties; $2,000,000 in a Targeted or Jumpstart County.'
  - The summary does not mention the 2028 sunset or 'Game Plan'; Madison County is not listed as Targeted/Jumpstart in it (county lists not checked).
  quotes:
  - "Cash rebate of up to 3% annually of the previous year's gross payroll (not including fringe benefits) (Jobs Credit)"
