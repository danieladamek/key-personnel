  study_design: regulation
  population: All Alabama employers, including the state and its political subdivisions; applicants and employees
  effect: ''
  read: full
  summary: 'Codified Clarke-Figures Equal Pay Act. Subsection (b) bars paying employees of another sex or race less for equal work in the same establishment, with four permitted differentials. Subsection (c) is the only salary-history provision: an employer may not refuse to interview, hire, promote or employ an applicant, or retaliate, because the applicant does not provide wage history; the section does not bar asking for wage history.'
  key_facts:
  - '§ 25-1-30(c): an employer may not refuse to interview, hire, promote or employ an applicant, or retaliate, because the applicant does not provide wage history (Act 2019-519).'
  - § 25-1-30(c) defines wage history as wages paid by the applicant's current or former employer; nothing in the section prohibits requesting wage history or using history the applicant volunteers.
  - '§ 25-1-30(d): an employer violating (b) or (c) is liable to the affected employee for the wages, and interest, of which the employee is deprived.'
  - '§ 25-1-30(e): record-keeping follows U.S. Department of Labor FLSA rules at 29 C.F.R. Part 516.'
  - '§ 25-1-30(h): a civil action under (d) may be commenced no later than two years after the act of discrimination.'
  quotes:
  - "An employer shall not refuse to interview, hire, promote, or employ an applicant for employment, (§ 25-1-30(c))"
  - "or retaliate against an applicant for employment because the applicant does not provide wage history. (§ 25-1-30(c))"
  - "Wage history means the wages paid to an applicant for employment by the applicant's current or former employer. (§ 25-1-30(c))"
  role_here: "support"
  role_note: "mirror of the Code of Alabama; official ALISON viewer unreachable"
  cited_in: ["10-the-state-overlay"]
