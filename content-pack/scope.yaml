  why: builder-proposed; the standard review of turnover theory
  proposed_by: builder
- citation: Rubenstein, Eberly, Lee & Mitchell (2018), Personnel Psychology; meta-analysis of turnover predictors
  why: builder-proposed; the effect sizes behind the retain stage
  proposed_by: builder
- citation: Burks, Cowgill, Hoffman & Housman (2015), Quarterly Journal of Economics; the value of hiring through employee referrals
  why: builder-proposed; the field evidence on referral hiring
  proposed_by: builder
- citation: Acemoglu & Pischke (1998, 1999); training in imperfect labor markets, with Becker (1964)
  why: builder-proposed; the economics of who pays for training and why trained staff are poached
  proposed_by: builder
- citation: 29 CFR 1607, Uniform Guidelines on Employee Selection Procedures
  why: builder-proposed; the legal frame of the select stage
  proposed_by: builder
- citation: 32 CFR 117 (NISPOM), SEAD 4 and SEAD 7, and the Trusted Workforce 2.0 quarterly progress reports
  why: builder-proposed; the governing text and the official numbers for the clear-and-start stage
  proposed_by: builder
- citation: A private 60-row staffing trade-off matrix in eight categories, supplied by the author on 2026-10-21
  why: >
    the author's own starting point, which he described as best guesses needing more rigor; carried as hypotheses.yaml,
    tested against the corpus, never cited as a source of fact; not in the repository
  proposed_by: author
excluded:
- what: law-firm, consultant and vendor commentary as a source of fact
  why: carried only as pointers to a primary source or as flags of a change; labelled secondary
- what: unverifiable turnover-cost and cost-per-hire figures repeated across blogs without a primary source
  why: the cost-of-turnover range (20-200% of salary) is a live dispute; only figures traceable to a named study or survey are carried, with their population
- what: vendor case studies as evidence of a lever's effect
  why: no control group; recorded, if at all, as practitioner-survey grade with the vendor named
assumed: false
assumptions:
- what: time window current_from 2021, seminal unlimited
  assumed: true
  why: stated as the default in the field sketch of 2026-10-21; not objected to
- what: depth deep (FAR Out-class catalogue of record files, several hundred sources)
  assumed: true
  why: Daniel asked for an app as detailed and robust as FAR Out
- what: anchors are the builder's from the pre-sweep; Daniel named none
  assumed: true
- what: delivery pages, no Zotero, no self-check questions, github account danieladamek, public repo danieladamek/key-personnel
  assumed: false
  why: answered in the scoping round (settings as FAR Out)
interview:
- q: Generalize the staffing matrix, remove the firm focus, and make an interactive tool for a recruiter at a small tech company?
  answer: Yes; a tool that narrows the trade-offs for a particular job opening or requisition, with an interactive dependency graph of the narrowed field, mitigations, and links to technical solutions or enablers.
  asked: '2026-10-21'
- q: How rigorous?
  answer: 'Generalize more, base it in best practices, reference all information; as detailed and robust as FAR Out. The original 60 trade-offs are just best guesses; we need more rigor. That applies to their categories as well.'
  asked: '2026-10-21'
- q: Which graph interaction?
  answer: 'The Alabama Mental Health Explorer systems map: the graph gives information about each node, the edges carry information about the dependencies, and the dependencies are listed below the node information panel.'
  asked: '2026-10-21'
- q: Which boundary? (three cuts offered from the field sketch)
  answer: 'Customer-governed small firms: federal primes and subs, cleared and uncleared; all four literatures plus the contractor gates. Out: state and local contracting, civil-service hiring, staffing agencies as a business.'
  asked: '2026-10-21'
- q: What organises the records, replacing the A-H categories?
  answer: 'Lifecycle stages: plan, attract, select, offer, clear and start, onboard, develop, retain, hand over; gates and levers cross-cut; the pathfinder starts from the observed failure point.'
  asked: '2026-10-21'
- q: Stance?
  answer: 'Evidence-graded practice guide: every lever carries an evidence grade and a controversies section covers cognitive-ability validity, turnover cost, skills-based hiring and pay transparency.'
  asked: '2026-10-21'
- q: Name and settings?
  answer: 'Key Personnel; settings as FAR Out: public GitHub Pages, no firm named, no Zotero, no self-check questions.'
  asked: '2026-10-21'
evidence_grades:
  meta-analysis: a published meta-analysis or systematic review; the effect size is quoted with its k and N as reported
  field-experiment: a randomized or natural experiment in real hiring or employment settings
  quasi-experimental: difference-in-differences, regression discontinuity or matched designs on administrative or firm data
  observational: cross-sectional or longitudinal survey research without a causal design
  practitioner-survey: SHRM, ClearanceJobs, Gallup and similar; benchmark facts only, publisher and year named
  regulation: statute, CFR, FAR/DFARS, executive order, agency directive; binds regardless of evidence
  guidance: an agency's or standards body's recommended practice (OPM, EEOC, ISO 30414); not binding, cited as guidance
  synthesis: a conclusion no cited work states on its own; marked visibly in the app and listed on /methods
hypothesis_statuses: see hypotheses.yaml header
search_strategy:
  run_on: '2026-10-21'
  pre_sweep: 22 searches and 7 primary pages read; logged in queries.yaml as slice P
  sources:
  - web search
  - direct fetch of official pages (ecfr.gov, acquisition.gov, federalregister.gov, dol.gov, eeoc.gov, dcsa.mil, dni.gov,
    performance.gov, bls.gov, gao.gov, opm.gov, state statute pages)
  - journal articles via publisher pages, author repositories and open-access preprints; working papers (IZA, NBER) marked as such
  - GAO, CRS, DoD IG and ODNI reports
  sweep_order_proposed:
  - 1 select
  - 2 attract
  - 3 offer
  - 4 clear-start
  - 5 onboard and develop
  - 6 retain and hand over
  - 7 plan
  - 8 gates, state records, indicators, changes
  - 9 links with evidence; hypothesis ledger adjudication; one recheck pass over everything
  sweeps_run: 1 select · 2 attract · 3 offer · 4 clear-start · 5 onboard and develop · 6 retain and hand over · 7 plan · 8 states, indicator refresh and changes (2026-10-21/22); sweep 9 (cross-stage links, ledger re-read, recheck pass) follows the first build as a content update
  inclusion:
  - peer-reviewed studies, meta-analyses and working papers (IZA, NBER) on selection, attraction, pay, onboarding, training and turnover, with the population and design recorded
  - statute, CFR, FAR and DFARS text, executive orders, agency directives and official guidance, read on the official page where it could be fetched
  - government reports and data (GAO, CRS, DoD IG, ODNI, the Performance Accountability Council, BLS, IRS, DOL, DCSA, NISPPAC)
  - practitioner surveys (SHRM, ClearanceJobs, NFIB, KFF, Robert Half) as benchmark facts with publisher and year
  - law-firm, vendor and advocacy compilations only as pointers to a primary source or as dated maps flagged compilation-sourced (states.yaml), never as a fact alone
  exclusion:
  - vendor case studies as evidence of a lever's effect
  - cost-of-turnover and cost-per-hire multiples with no named study or survey behind them
  - rodent, laboratory or non-employment studies
  - pages that could not be fetched or read (recorded in queries.yaml with hits 0 and in todo.yaml)
  snowball:
  - backward from the anchors (Sackett 2022; Rubenstein 2018; Burks et al.; Acemoglu and Pischke; the Uniform Guidelines; 32 CFR 117; SEAD 4 and 7; the TW 2.0 reports)
  - forward from each stage's meta-analyses to the field studies they cite
  known_gaps:
  - SEAD 8 beyond its first page; SEAD 3 itself (an agency summary served); the NISPPAC chart labels (a vendor restatement served)
  - the full Rubenstein predictor table (promotional chances and pay satisfaction rows); the bodies of Allen, Bryant and Vardaman, Harter et al. and Dube et al. (abstracts only)
  - Blume et al. 2010 and Colquitt et al. 2000 (carried through Grossman and Salas); Allen et al. 2004 and Eby et al. 2008 (abstracts only)
  - the statutes behind almost every state-overlay row (states.yaml primary_pending; todo t-8001); the DOL Women's Bureau state table (an image)
  - no public count of clearance holders after the 2019 ODNI report; no 2025 or 2026 relocation release surfaced; the FY2026 Q4 vetting report not yet posted
  - the Chamber of Commerce v. DHS opinion and any appellate merits decision on the H-1B payment; the personal-services section of FAR Case 2026-002
