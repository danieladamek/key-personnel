# scope.yaml — Key Personnel · the record the guide is accountable to; renders on /methods. Queries are logged in queries.yaml.
topic: >
  Generalize the staffing trade-offs and dependencies matrix (remove the firm focus) into an interactive tool that lets a
  recruiter at a small technical company narrow the trade-offs for a particular job opening or requisition, with an
  interactive dependency graph of the narrowed field, mitigations, and links to technical solutions or enablers. Then
  generalize further, base it in best practices, reference all information, and make it as detailed and robust as FAR Out.
  The original 60 trade-offs and their eight categories are best guesses; more rigor is needed for both.
question: >
  For a small technical firm whose hires must satisfy a contract or a customer, what actually constrains filling and
  keeping a position at each stage from workforce planning to handover; what does the evidence say each lever does and
  does not do; which regulatory and contractual gates bind a given opening; how do the constraints depend on one another;
  and what public data, programs and tools can a recruiter without an HR department put to work?
purpose: practice-guide
boundary:
  in:
  - 'customer-governed small firms: federal prime and subcontractors, cleared and uncleared, and any small technical firm
    whose hires must satisfy a labor category, a key-personnel clause, a rate ceiling, a clearance or a customer approval'
  - 'the four literatures: personnel selection (I/O psychology), turnover and retention, the labor economics of hiring and
    training, and the contractor-specific regulatory gates'
  - 'the lifecycle stages the selection and turnover literatures use: plan, attract, select, offer, clear and start,
    onboard, develop, retain, hand over'
  - 'the gates: E-Verify and I-9, clearance sponsorship and Trusted Workforce 2.0, export control (ITAR/EAR U.S. persons),
    VEVRAA and Section 503 plans, EEO and the Uniform Guidelines, background checks and the Fair Chance Act, drug-free
    workforce, Service Contract Act wage determinations, key-personnel and labor-category approval, compensation
    allowability (FAR 31.205-6), state pay-transparency, salary-history, non-compete and AI-hiring laws'
  - 'public benchmarks and indicators with their dates: BLS JOLTS and OEWS, employee tenure, SHRM time-to-fill and
    cost-per-hire, DCSA/TW 2.0 timeliness and inventory, ClearanceJobs compensation, ODNI clearance population'
  - 'programs and enablers: DoD SkillBridge, Hiring Our Heroes, registered apprenticeship, Handshake, O*NET, NICE
    framework, GSA CALC+, tooling categories (ATS, talent CRM, scheduling, assessment, dashboards), recorded as stated'
  - 'what changed in 2025-26: EO 14173 and OFCCP''s three final rules, the FTC non-compete rule''s end, the H-1B fee
    proclamation and rulemaking, state law effective dates, SkillBridge employer mandates, TW 2.0 milestones, GAO findings
    on clearance data'
  out:
  - state and local government contracting as a customer model (federal and prime customers only)
  - federal civil-service hiring (Title 5, USAJOBS) except where a contractor competes with it for the same people
  - staffing agencies and recruiting firms as a business; fee structures appear only as facts in enabler records
  - immigration law beyond what an employer must know to sponsor or hire (the H-1B fee and E-Verify are in; visa strategy is out)
  - benefits design, payroll administration and HR information systems beyond their role in a lever
  - labor relations and collective bargaining
  - anything tailored to a specific firm; no firm is named anywhere in the pack or the app
  - recommendations of paid consultants, tools or memberships; fees are reported as facts with sources
  rationale: >
    Daniel, 2026-10-21: the app must have no firm focus and serve any recruiter at a small technical company; the
    boundary "customer-governed small firms" was chosen from three offered cuts. Out-list proposed by the builder on
    2026-10-21 and not yet objected to.
level: >
  the opening: what constrains filling and keeping one requisition, at which stage, under which gates; the firm: what it
  can change (levers) and what it cannot (gates, customer decisions, the labor market); the evidence: what each lever has
  been shown to do, in which population, by which study design
time_window:
  current_from: 2021
  current_rationale: Trusted Workforce 2.0 and continuous vetting, the post-2020 labor market, the 2025-26 regulatory changes
  seminal: >
    statute, regulation and policy of any age that governs a gate; the landmark studies of any age that the current
    literature still rests on (Becker 1964 onward)
stance: evidence-graded-practice-guide
depth: deep
