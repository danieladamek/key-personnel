# controversies.yaml — Key Personnel · the live disputes, each position named and cited; `what_a_recruiter_can_rely_on` is marked synthesis.
- id: cognitive-ability-validity
  name: How much do cognitive ability tests predict, and at what cost?
  question: >
    Is general mental ability the best single predictor of job performance (ρ ≈ .51), as the field held from 1998, or a
    mid-table predictor (ρ ≈ .31) with the largest adverse-impact exposure, as the 2022 re-estimation says?
  positions:
  - holder: Schmidt & Hunter (1998) and the meta-analytic tradition
    claim: 'GMA validity .51; GMA plus integrity test (R = .65), work sample (.63) or structured interview (.63) are the best combinations [4]'
    sources: [4]
  - holder: Sackett, Zhang, Berry & Lievens (2022, 2023)
    claim: 'prior corrections applied predictive-study range restriction to concurrent studies and overcorrected; with no correction for concurrent studies cognitive ability falls to .31 and structured interviews lead at .42; cognitive ability carries d = .79 [1] [3]'
    sources: [1, 3]
  - holder: Oh, Le & Roth (2023)
    claim: 'the conditions under which Sackett et al. call concurrent range restriction negligible (r ≈ .90 with the selection variable; selection ratio ≤ .30) are plausible, and their Table 5 understates the bias; the no-correction recommendation lacks support [2]'
    sources: [2]
  - holder: Practitioner summaries (SIOP TIP; HumRRO)
    claim: 'the practitioner summaries treat the revision as a course correction, advise against correcting without empirical support, and expect structured interviews to become the focal predictor [52] [53]'
    sources: [52, 53]
  what_a_recruiter_can_rely_on: >
    Both sides agree on the ordering that matters for a small firm: a structured interview, a job-knowledge test and a work
    sample each predict well, and a cognitive test adds the largest group difference of any common predictor [1] [4]. The
    dispute is about the size of the cognitive-ability coefficient, not about whether structure beats judgement. A firm that
    builds a structured interview and a job-relevant work sample, scores them mechanically, and monitors selection rates is on
    the right side of both positions (synthesis).
  sources: [1, 2, 3, 4, 52, 53]

- id: skills-based-hiring
  name: Does dropping degree requirements change who is hired?
  question: >
    Firms announced the removal of degree requirements at scale from 2017; did hiring of workers without degrees follow?
  positions:
  - holder: Burning Glass Institute and Harvard Business School (2024)
    claim: 'roles dropping degree requirements rose almost fourfold 2014–2023, but non-degree hiring in them rose only 3.5 percentage points and the economy-wide effect was less than one hire in 700; firms sort into Leaders, "In Name Only" and Backsliders; the non-degree hires made stayed longer [68] [58]'
    sources: [58, 68]
  - holder: Harvard Business School and Accenture, Hidden Workers (2021)
    claim: 'the filters, not the announcements, decide: 88 percent of employers report their systems reject qualified candidates on exact-match criteria [44]'
    sources: [44]
  - holder: Employers themselves (NACE 2026)
    claim: 'nearly 70 percent of campus-recruiting employers say they use skills-based hiring [79]'
    sources: [79]
  - holder: The selection literature
    claim: 'years of experience predicts job performance at .07 and years of education was excluded for insufficient data; what predicts is structured interviews, knowledge tests and work samples [1]'
    sources: [1]
  what_a_recruiter_can_rely_on: >
    The credential is a weak proxy [1] and the announcement is not the practice [44] [58]. Dropping a degree line from the
    posting changes hiring only when the screen and the assessment change with it; where they do, the people hired without
    the credential stay longer [68]. For a small firm the sequence that follows from the positions is a job analysis, a
    skill-based posting, an affirmative filter and a work sample or knowledge test, in that order (synthesis from [1] [44]
    [68]). Where a customer's labor category requires the degree, the requirement is the customer's to lift (sweep 7).
  sources: [1, 44, 58, 68, 79]

- id: pay-transparency
  name: Does pay transparency help or hurt a small employer's offers?
  question: >
    Posting laws, right-to-discuss protections and salary-history bans have spread since 2018; do they raise pay, lower it,
    compress it, or shift it between groups, and which kind of transparency is which?
  positions:
  - holder: Cullen & Pakzad-Hurson (Econometrica 2023)
    claim: 'state laws protecting the right to discuss coworkers'' pay lowered wages by about 2 percent, because employers credibly refuse to pay any one worker more to avoid renegotiating with everyone; effects muted where pay is posted or collectively bargained [90]'
    sources: [90]
  - holder: Arnold, Quach & Taska (NBER 2025)
    claim: 'state laws requiring pay ranges in postings raised disclosure by about 30 points and wages by 1.3 to 3.6 percent with no effect on employment, postings or dispersion, through increased competition across firms [97]'
    sources: [97]
  - holder: Cullen (JEP 2024)
    claim: 'the effects depend on the type: cross-worker transparency compresses and lowers average wages; vertical transparency raises motivation; cross-firm transparency moves workers to higher-paying firms and intensifies competition [91]'
    sources: [91]
  - holder: Card, Mas, Moretti & Saez (AER 2012)
    claim: 'learning peers'' pay lowers satisfaction and raises job search for those below the median and does nothing for those above [92]'
    sources: [92]
  - holder: Hansen & McNichols (NBER 2020)
    claim: 'early salary-history bans raised the gender earnings ratio by about 1 percent, mainly among job changers [96]'
    sources: [96]
  what_a_recruiter_can_rely_on: >
    The posted range is cross-firm transparency, and the evidence says it raises what the firm has to pay by a few percent
    while raising applicant counts [97] [91]; coworker transparency is the compression mechanism [92] [90], and the posted
    range is now the law in many states whether the firm likes it or not [97]. A small firm that posts a defensible range,
    states negotiability, reviews incumbents before each offer and sets pay from the job rather than from prior salary is
    acting on the evidence from all five positions at once [90] [91] [92] [96] [97]; the thing it cannot do is keep a new
    hire's pay from becoming the incumbents' comparison point (synthesis from [92]).
  sources: [90, 91, 92, 96, 97]

- id: clearance-timeliness-figures
  name: How long does a clearance take, and which figure should a recruiter plan on?
  question: >
    The government publishes several clearance timelines that differ by a factor of three or more; which one describes the
    wait a sponsored contractor hire will face, and how far can any of them be trusted?
  positions:
  - holder: Performance Accountability Council, Trusted Workforce 2.0 quarterly report (FY2026 Q3)
    claim: 'government-wide end-to-end figures for initial moderate-risk cases in the tens of days and for high-risk cases around a hundred, against targets of 40 and 75 days, with the reporting basis moving from the fastest 90 percent to all cases in FY2026 Q3 and the text saying speeds have declined quarter over quarter [54]'
    sources: [54]
  - holder: DCSA industry figures presented to the NISPPAC (FY2026 Q3)
    claim: 'industry initial cases average 197 days for a Secret and 243 for a Top Secret, all cases, with adjudication the longest phase; not comparable with the earlier fastest-90-percent figures of 156 and 227 [126] [124] [125]'
    sources: [124, 125, 126]
  - holder: GAO (GAO-26-107100, December 2025)
    claim: 'most published timeliness statistics for FY2024 were inaccurate, chiefly because DCSA''s method understated processing time from 2020 to 2024, and pending-adjudication counts were off by large factors [56]'
    sources: [56]
  - holder: Federal Clearance Assistance Service (practitioner, 2026)
    claim: 'averages hide the distribution a hiring manager needs; no public figure exists for how often or how fast contractor applicants receive interim eligibility, and the industry bar graphs arrive four to six months after the data [127]'
    sources: [127]
  what_a_recruiter_can_rely_on: >
    The figure a recruiter can rely on is the DCSA industry number for the current quarter, read as a floor, because the
    government-wide number mixes faster federal cases with industry's [54] [126], the series changed basis in FY2026 Q3
    [126], and GAO found the older figures understated [56]. A start date that depends on an interim grant rests on
    nothing published, since nobody publishes how often one is granted [127]. The only phase the firm influences is
    initiation, about three weeks of the total [126] (synthesis).
  sources: [54, 56, 124, 125, 126, 127]

- id: who-pays-for-training
  name: Who pays for general training, and who keeps the return?
  question: >
    A small firm trains people in skills any employer can use; the theory says the worker should pay, the practice says the
    firm does, and the law is narrowing how the firm can hold the investment. What should a firm expect to recover, and how?
  positions:
  - holder: Standard human-capital theory (as stated in Acemoglu & Pischke's framing)
    claim: 'workers pay for general training because they can take it anywhere, so firms should fund only firm-specific skills [161]'
    sources: [161]
  - holder: Acemoglu & Pischke (QJE 1998)
    claim: 'firms do pay for general training because they know the trained worker''s ability better than rival employers, which gives them ex post monopsony power; the economy can sit in a low-training, high-quit equilibrium or a high-training, low-quit one [161]'
    sources: [161]
  - holder: Dearden, Reed & Van Reenen (OBES 2006)
    claim: 'training raises value added per hour about twice as much as it raises wages, so the firm keeps part of the return while the worker stays [159]'
    sources: [159]
  - holder: Manchester (ILR Review 2012)
    claim: 'tuition reimbursement raised retention, but 80 percent of the effect came through who sorted into the firm, not through the people reimbursed [160]'
    sources: [160]
  - holder: Consumer Financial Protection Bureau (2023) and the California and Colorado legislatures
    claim: 'repayment provisions shift the cost and the risk to the worker, chill mobility whether or not enforced, and are now barred or narrowed by statute; the research the Bureau cites puts their effect at about 15 percent less quitting [166] [167] [168]'
    sources: [166, 167, 168]
  what_a_recruiter_can_rely_on: >
    What a recruiter can rely on is recovery of the investment through the productivity–wage wedge while the person stays
    [159] and through the applicants the offer of training attracts [160], not through a repayment clause, which is now
    unlawful in the strictest states for most purposes [167] [168] and a reputational cost everywhere [166]. The things
    that extend the stay are the ones the retain stage covers, pay that moves with capability and a next assignment; the
    things that shorten it are a cleared, certified professional's outside market [161] (synthesis).
  sources: [159, 160, 161, 166, 167, 168]

- id: cost-of-turnover
  name: What does a departure actually cost?
  question: >
    Practitioner literature puts the cost of replacing an employee at 90 to 200 percent of salary; the measured case studies
    put the median near a fifth; the unit-level evidence measures the cost in customer and productivity terms rather than
    dollars. Which figure should a small firm plan with?
  positions:
  - holder: Trade and practitioner literature (e.g., the Performance Improvement Council white paper)
    claim: 'direct costs of 50 to 60 percent of salary and total costs of 90 to 200 percent, stated without a named study [195]'
    sources: [195]
  - holder: Boushey & Glynn (Center for American Progress, 2012)
    claim: 'across 27 case studies excluding executives and physicians the median replacement cost was 21 percent of annual salary, 16 percent for jobs under $30,000 and up to 213 percent at the top; only 2 of 11 papers counted indirect costs [180]'
    sources: [180]
  - holder: Heavey, Holwerda & Hausknecht (JAP 2013)
    claim: 'at the unit level, turnover rates correlate about −.22 with customer satisfaction and production efficiency and −.15 with profit margin, the same for voluntary and total turnover [181]'
    sources: [181]
  - holder: Jäger & Heining (NBER 2022)
    claim: 'the replacement cost of a worker is substantial and largest for specialised skills and in thin labour markets, where the firm also pays the remaining specialists more [193]'
    sources: [193]
  - holder: Allen, Bryant & Vardaman (AMP 2010)
    claim: 'the practice literature carries misconceptions about turnover that the evidence does not support; retention should be managed from the measured predictors [179]'
    sources: [179]
  what_a_recruiter_can_rely_on: >
    The figure a recruiter can rely on is the measured fifth of salary for ordinary replacements [180], with the indirect
    costs the case studies left out counted on top [180] [179]; the specialist whose market is thin is the exception the
    multiples were invented for [193] [195], and there the cost is the contract's capacity, the customer's satisfaction
    [181] and the pay of everyone adjacent [193], which is why the handover stage spends delivery time on cross-training
    (synthesis).
  sources: [179, 180, 181, 193, 195]
