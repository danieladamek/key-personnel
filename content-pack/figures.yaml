# figures.yaml — Key Personnel · eight synthesised figures (topic mode: synthesis data | conceptual; every figure carries refs). Written 2026-10-22.
- id: validity-2022
  label: Figure 1
  title: 'What predicts job performance, and at what cost in group differences: the 2022 re-estimates'
  kind: chart
  synthesis: data
  refs:
  - 1
  - 4
  chart:
    type: grouped-bar
    x:
      field: method
      label: Selection method
    y:
      field: value
      label: Operational validity (correlation with performance) or Black–White d
    series:
      field: statistic
      label: Statistic
  data: figures/data/validity-2022.csv
  caption: Operational validities and Black–White standardized differences for twelve selection methods, as Sackett, Zhang, Berry and Lievens re-estimated them in 2022 after removing range-restriction corrections that earlier meta-analyses had applied to concurrent studies [1]. Structured interviews lead at .42 with a d of .23; cognitive ability tests sit at .31 with the largest group difference, .79; years of experience predict almost nothing at .07 [1]. The 1998 estimates these replaced were higher for most methods (structured interviews .51; cognitive ability .51) [4] [1].
  how_to_read: Each pair of bars is one method. The first bar is how well scores predict later performance, where .42 is a strong result in this literature and .07 is close to nothing. The second bar is the Black–White difference in scores in standard-deviation units, where a larger number means a larger gap and therefore more adverse impact at any cutoff. The methods a recruiter wants are high on the first bar and low on the second; the chart shows that no method is best on both.
  explain:
  - 'on': operational validity
    text: The corrected correlation between the method and later job performance, as the 2022 meta-analysis reports it [1].
    term: operational-validity
  - 'on': Black–White d
    text: The difference in mean scores between Black and White samples in standard-deviation units; the authors say the values mix applicant, incumbent and national samples and are meant to locate a method as having large, modest or minimal differences [1].
    term: subgroup-difference
  concepts:
  - what-predicts-performance
  - reading-an-effect-size
  discussed_in:
  - 1-what-predicts-a-good-hire
  - 8-the-controversies
  source: Values are as published in the 2022 article as the pack recorded them [1]; no re-analysis, no pooling. Each row of the data file names its reference.
- id: turnover-predictors
  label: Figure 2
  title: 'What predicts voluntary turnover: corrected correlations from 316 studies'
  kind: chart
  synthesis: data
  refs:
  - 178
  chart:
    type: bar
    x:
      field: predictor
      label: Predictor
    y:
      field: rho
      label: Corrected correlation with voluntary turnover
  data: figures/data/turnover-predictors.csv
  caption: Eighteen predictors of voluntary turnover from the 2018 meta-analysis by Rubenstein, Eberly, Lee and Mitchell, drawn from 316 articles with a mean lag of about 16 months, most samples from the United States [178]. Withdrawal cognitions (.56) and job search (.40) are the strongest; commitment, fit, satisfaction and embeddedness run between −.26 and −.29; pay is −.17 and workload −.10 [178].
  how_to_read: Bars to the right mean more of the predictor goes with more quitting; bars to the left mean more of it goes with less quitting. The number beside each bar in the data file, k, is how many studies it rests on; a bar built on four studies (engagement) is less settled than one built on 211 (withdrawal cognitions). The retain-stage records are ordered by this chart.
  explain:
  - 'on': withdrawal cognitions
    text: Thinking about quitting and intending to; the strongest predictor at .56 across 211 studies [178].
    term: withdrawal-cognitions
  - 'on': job embeddedness
    text: The links, fit and sacrifices that hold a person in place; −.26 across 29 studies [178].
    term: job-embeddedness
  - 'on': pay
    text: Pay level correlates −.17 with quitting, weaker than the attitudes above it; the peer-comparison evidence in the offer and retain records explains part of why [178].
  concepts:
  - why-people-leave
  discussed_in:
  - 6-why-people-stay-and-why-they-leave
  source: Correlations and k are as published in the meta-analysis as the pack recorded them [178]; no re-analysis. Climate and engagement rest on few studies and are shown as reported.
- id: clearance-clock
  label: Figure 3
  title: The clearance clocks as the official and reported figures state them
  kind: table
  synthesis: data
  refs:
  - 54
  - 124
  - 125
  - 126
  - 56
  columns:
  - field: measure
    label: Measure
  - field: level
    label: Level or population
  - field: days
    label: Days
  - field: basis
    label: Basis
  - field: period
    label: Period
  - field: publisher
    label: Publisher
  - field: ref
    label: Reference
  data: figures/data/clearance-clock.csv
  caption: The targets and the measured clocks side by side. Trusted Workforce 2.0 sets 40 days for Moderate Risk and 75 for High Risk end to end [54]. Industry initial cases ran 197 days for Secret and 243 for Top Secret in FY2026 Q3 on an all-cases average, with adjudication now the longest segment [126]; the FY2026 Q1 figures of 156 and 227 days were on the older fastest-90-percent basis and are not comparable [124]. DHS contractor cases took 76 days to investigate and 41 more from a favorable determination to onboarding in the same quarter [125]. GAO found the earlier DCSA statistics understated timelines from 2020 to 2024 [56].
  how_to_read: 'Read the basis column before comparing rows: an all-cases average and a fastest-90-percent figure measure different things, and the reporting basis changed in FY2026 Q3. The targets are government-wide goals; the industry rows are what cleared-contractor cases actually took. A recruiter planning an offer-to-start interval uses the longest plausible row for the level the contract requires, not the target.'
  explain:
  - 'on': basis
    text: DCSA moved its industry reporting from the fastest 90 percent of cases to the average of all cases in FY2026 Q3, which raised the published figures without a change in the underlying process [126] [54].
    term: end-to-end-timeliness
  - 'on': adjudication
    text: 'At both levels adjudication now takes longer than the investigation itself: 117 days for Secret and 126 for Top Secret [126].'
  concepts:
  - the-clearance-process
  discussed_in:
  - 4-from-accepted-offer-to-productive-start
  - 8-the-controversies
  source: Figures are as published in the FY2026 Q3 progress report [54], the NISPPAC slides of September 2026 [125] and the two ClearanceJobs restatements of the DCSA presentations [124] [126]; the DCSA chart labels could not be read cleanly, so the vendor restatements are carried with that caveat in the clearance-timeliness controversy record. No conversion.
- id: ledger-outcomes
  label: Figure 4
  title: How the author's sixty guesses fared against the evidence
  kind: table
  synthesis: data
  refs:
  - 60
  - 197
  - 119
  - 98
  - 1
  - 152
  - 178
  - 205
  - 144
  columns:
  - field: category
    label: Category
  - field: original_category
    label: As the matrix named it
  - field: reframed_to
    label: Where it went
  - field: rows
    label: Rows
  - field: supported
    label: Supported
  - field: partly_supported
    label: Partly supported
  - field: unstudied
    label: Unstudied
  - field: ref
    label: Leading reference
  data: figures/data/ledger-outcomes.csv
  caption: The guide began from a private matrix of 60 trade-offs in eight categories with seven observed failure points, which its author called best guesses. Each became a hypothesis and was adjudicated against the sources read in the seven stage sweeps. Twenty rows are supported, 43 are supported with qualifications, four could not be studied because nothing was found either way, none was contradicted, and all eight categories were reframed into the lifecycle stages the selection and turnover literatures use [1] [178] [152] [119]. The leading reference column names the source each category's adjudications lean on most.
  how_to_read: Each row is one of the original categories, with the stage it became and how its rows came out. A supported row has a cited study or rule behind it; a partly supported row survives with a qualification stated in the ledger; an unstudied row is one the sweeps could not find evidence for or against, and the levers that carry those practices say so. The full ledger, with every adjudication and its citations, is on the methods page.
  explain:
  - 'on': unstudied
    text: 'Four rows closed as unstudied: agency fee levels, customer rejection feedback, single requisition ownership and customer approval cycles. The pack carries the practices without evidence of effect and marks them as such.'
    term: hypothesis-ledger
  - 'on': reframed
    text: A category was reframed when the evidence organised its rows differently, for example retention by the ranked turnover predictors rather than by the employee experience [178].
  concepts:
  - how-this-guide-fits-together
  discussed_in:
  - 11-how-the-evidence-was-gathered
  source: Counts are taken from hypotheses.yaml, the guide's own ledger, as closed at version 1.0 on 2026-10-22; the ref column names the reference each category's adjudications cite most. The matrix itself is not in the pack and is never cited as a source of fact.
- id: stage-map
  label: Figure 5
  title: Nine stages, four groups of gates and eight failure patterns
  kind: pathway
  synthesis: conceptual
  refs:
  - 119
  - 98
  - 197
  - 30
  - 187
  - 191
  - 152
  - 178
  - 1
  - 144
  data: figures/data/stage-map.json
  caption: 'The spine of the guide drawn as one picture: the nine lifecycle stages in order, the four groups of gates that bind them (the contract and customer through the labor category, the key-personnel clause and the rate ceiling [98] [197]; the law through the Uniform Guidelines and the hiring statutes [30]; the government through eligibility, sponsorship and vetting [119]; the law again through the repayment, noncompete, no-poach and notice rules [187] [191]), and the eight observed failure patterns placed at the stage where each is seen. This is a conceptual figure: it shows how the records are organised, not any one firm''s process.'
  how_to_read: 'Follow the middle row left to right from planning an opening to handing a role over. The boxes above and below the row are the rules that bind the stages they connect to; a thicker connection means more of that stage''s gates belong to the group. The boxes at the bottom are the failure points the pathfinder starts from: pick the one you are seeing and the stage it points at is where the constraints to read are.'
  explain:
  - 'on': 'nodes: stage'
    text: The nine stages the selection and turnover literatures use, as the stage records state them; each record says who decides what at that stage.
    term: failure-pattern
  - 'on': 'nodes: gate group'
    text: A grouping of the gate records for the picture only; each gate record names its governing text.
    term: gate-record
  - 'on': 'nodes: pattern'
    text: The seven failure points from the original matrix, re-derived from the evidence, plus the customer-rejection pattern; each pattern record lists the constraints it points at in order of the evidence.
    term: failure-pattern
  concepts:
  - how-this-guide-fits-together
  discussed_in:
  - 0-how-to-read-this-guide
  source: The drawing is the builder's own, built from the stage, gate and pattern records; the gate groupings are a simplification for the picture and the records themselves are the authority.
