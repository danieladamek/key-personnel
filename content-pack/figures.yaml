  chart:
    type: bar
    x:
      field: overlay
      label: Overlay
    y:
      field: states
      label: States with a statewide rule
  data: figures/data/state-overlay-counts.csv
  caption: 'Counts of states carrying a statewide rule in each of the nine overlays of the state records, taken from the dated compilations each overlay rests on: the pay-transparency and salary-history maps [207] [76], the noncompete tracker [209] with Washington''s 2026 statute [210], the stay-or-pay map [211], the AI chart [220], the cannabis page [219], the fair-chance guides [216] [217], the credit-check guide [218] and the mini-WARN chart [214] [213]. The District of Columbia is counted in the note column where it carries the rule.'
  how_to_read: 'Each bar is the number of states whose law the compilation lists as statewide on the date it was read; the note beside each bar in the data file says what is pending and which states joined in 2026. A short bar is not a safe assumption for any one state: the state record is where to look, and almost every row of it rests on a compilation rather than the statute, which the record says in its primary_pending flag.'
  explain:
  - 'on': statewide rule
    text: A rule the compilation lists as applying across the state to private employers; local ordinances (New York City, Chicago, Philadelphia, the Ohio cities) are in the localities line of the state records and not counted here [207] [218].
  - 'on': pending
    text: Washington's noncompete ban takes effect on 2027-06-30 [210]; New York's stay-or-pay act on 2027-02-13 [211]; Colorado, Connecticut and Delaware's AI duties in 2027 [220].
  concepts:
  - reading-a-gate
  discussed_in:
  - 10-the-state-overlay
  source: Counted by the builder from states.yaml on 2026-10-22, where each state record cites the compilation behind it; the compilations are law-firm, vendor and advocacy pages, and the statutes themselves are a listed todo. No state law was read for this figure except Washington's two session laws and Colorado's fiscal note.
- id: pay-transparency-effects
  label: Figure 7
  title: What pay transparency and salary-history rules did to pay, in the studies that measured it
  kind: table
  synthesis: data
  refs:
  - 90
  - 91
  - 92
  - 96
  - 97
  columns:
  - field: study
    label: Study
  - field: policy
    label: Policy studied
  - field: finding
    label: Finding as published
  - field: population
    label: Population
  - field: design
    label: Design
  - field: ref
    label: Reference
  data: figures/data/pay-transparency-effects.csv
  caption: Five measured effects of transparency and salary-history rules. Right-to-discuss laws lowered wages by about 2 percent [90]; posting laws raised disclosure by about 30 percentage points and wages by 1.3 to 3.6 percent with no change in employment [97]; salary-history bans raised the gender earnings ratio by about 1 percent, driven by job changers [96]; told where they stood, below-median earners at one employer grew less satisfied and looked for work while above-median earners did not change [92]. The review that frames them says the effect depends on which kind of transparency a rule creates [91].
  how_to_read: 'Read the policy column first: these are different rules with different mechanisms, and the findings do not add up to one number. The population column says where the result was measured; a result from one employer is a result from one employer. The design column is the evidence grade the guide uses.'
  explain:
  - 'on': right-to-discuss
    text: Laws protecting workers who ask about coworkers' pay; the wage effect is muted where workers have little individual bargaining power [90].
    term: pay-range-posting-law
  - 'on': posting law
    text: A requirement to state the range in the advertisement, the rule the state overlay tracks [97].
    term: pay-range-posting-law
  concepts:
  - the-labor-category-and-the-wrap-rate
  discussed_in:
  - 3-pay-in-a-rate-constrained-firm
  - 8-the-controversies
  source: Findings are quoted as the pack recorded them from each study's reported results [90] [91] [92] [96] [97]; no pooling, no conversion.
- id: cost-of-a-hire
  label: Figure 8
  title: What an opening costs and how long it takes, figure by figure, with the population each rests on
  kind: table
  synthesis: data
  refs:
  - 196
  - 43
  - 180
  - 157
  - 144
  - 113
  - 202
  columns:
  - field: measure
    label: Measure
  - field: value
    label: Value
  - field: period
    label: Period
  - field: population
    label: Population
  - field: publisher
    label: Publisher
  - field: ref
    label: Reference
  data: figures/data/cost-of-a-hire.csv
  caption: The cost and time figures the plan-stage records carry, each with its population. The 2025 SHRM medians are $1,200 per nonexecutive hire and $10,625 per executive hire, with small organisations running six requisitions per recruiter [196] and filling in about 45 days [43]. The replacement-cost median across 27 case studies is 21 percent of annual salary [180]. Output at one autoglass company was 53 percent higher after a year than at hire [157]; 4.1 percent of accepted entry-level offers at one telecommunications company never started [144]; managers surveyed by a staffing firm reported a mean stay of 1.7 years after an accepted counteroffer [113]; the default federal payment clock is 30 days from a proper invoice [202].
  how_to_read: 'No row is a benchmark for any one firm. The population column says who was measured, and three rows come from a single employer or a single survey; the records that cite them say so. Read the table as the parts of a cost that an invoice does not show: what it takes to acquire a hire, what a vacancy costs while it stands, and how long the cash is out before the customer pays.'
  explain:
  - 'on': cost per hire
    text: SHRM defines it as the costs of a new hire (agency fees, job boards, referral costs, travel, relocation, recruiter pay and benefits, systems) divided by hires [196].
    term: cost-per-hire
  - 'on': replacement cost
    text: The median of 27 case studies excluding executives and physicians; only 2 of the 11 papers behind them counted indirect costs, which is why the guide treats larger multiples as a controversy [180].
    term: replacement-cost
  concepts:
  - the-cost-of-a-vacancy
  discussed_in:
  - 7-planning-the-workforce
  source: Values are as published by each source as the pack recorded them [196] [43] [180] [157] [144] [113] [202]; no conversion.
