# patterns.yaml — Key Personnel · observed failure points, the pathfinder's first question. Sweep 1 writes the two select-stage patterns;
# the original matrix's seven patterns are hypotheses (hypotheses.yaml h-pattern-*) until each stage's sweep re-derives them.
- id: many-apply-few-qualify
  name: Many applicants, few who qualify
  stage: select
  what: >
    The posting draws volume but the screen passes almost no one, or passes people who then fail at interview. The evidence
    points first at the screen itself: exact-match criteria reject qualified candidates (88 percent of employers say so) [44]
    and the proxies they use are weak predictors (experience-years .07) [1]; then at the decision method, since unstructured
    judgement predicts at .19 and dilutes stronger evidence [1] [8]; and then at the validity of whatever assessment is used
    [32].
  points_at: [c-keyword-screen-rejects-qualified, c-unstructured-judgement, c-unvalidated-criteria, c-validity-diversity-tradeoff, c-technical-interview-measures-anxiety]
  reasons:
  - constraint: c-keyword-screen-rejects-qualified
    why: 'the first screen is the usual culprit when volume is high and pass-through is low [44] [1]'
  - constraint: c-unstructured-judgement
    why: 'if the screen passes people who then fail at interview, the interview may be the unreliable instrument [1] [8] [9]'
  - constraint: c-unvalidated-criteria
    why: 'criteria never tied to the job predict neither who qualifies nor who performs [32]'
  - constraint: c-validity-diversity-tradeoff
    why: 'a cognitively loaded screen used for ranking narrows the pool along group lines as well as ability [1] [32]'
  - constraint: c-technical-interview-measures-anxiety
    why: 'for software roles, the live-coding format fails capable candidates [21]'
  legacy: [h-pattern-p2]
  sources: [1, 8, 9, 21, 32, 44]

- id: withdraw-mid-process
  name: Candidates withdraw before a decision
  stage: select
  what: >
    Candidates who entered the process stop responding or decline to continue before an offer. In the one large field study,
    withdrawal tracked perceptions of the organisation and the process, career commitment, current employment, relocation and
    the views of family and friends, with different reasons at different stages [16]; earlier offers were more often accepted
    [15]; 41 percent of organisations reported rising ghosting in 2025 [43].
  points_at: [c-slow-decisions-lose-candidates, c-process-burden-withdrawal, c-technical-interview-measures-anxiety, c-premature-inquiries]
  reasons:
  - constraint: c-slow-decisions-lose-candidates
    why: 'delay between stages, and between final interview and offer, is the modifiable correlate of acceptance [15]'
  - constraint: c-process-burden-withdrawal
    why: 'each added stage is a fresh chance to leave; withdrawers differ by stage [16] [14]'
  - constraint: c-technical-interview-measures-anxiety
    why: 'the format itself is described as a reason to avoid the process [22]'
  - constraint: c-premature-inquiries
    why: 'intrusive or exclusionary questions read as unfair, and fairness perceptions predict acceptance intentions [14] (synthesis)'
  legacy: []
  sources: [14, 15, 16, 22, 43]

# ---- sweep 2 (attract), 2026-10-21 ----
- id: few-plausible-candidates
  name: Few plausible candidates
  stage: attract
  what: >
    The opening draws too few applicants who could do the job. Among small businesses hiring in September 2026, 87 percent
    reported few or no qualified applicants [71]. The evidence orders the causes: a posting whose title, pay figure or wording
    sends it to the wrong queue [65] [77]; a credential requirement that excludes capable people for almost no validity [1]
    [68]; a reach limited to people who will relocate, now under two percent of job seekers [85]; a referral network that is
    small or all alike [81]; an image candidates do not hold [64]; and, for cleared work, a pool that no one can enter without a
    sponsor [80].
  points_at: [c-posting-draws-wrong-applicants, c-degree-requirement-shrinks-pool, c-local-pool-thin, c-referral-network-narrow, c-ad-wording-and-targeting-exclude, c-employer-image-weak, c-cleared-supply-scarce, c-channel-mix-untested]
  reasons:
  - constraint: c-posting-draws-wrong-applicants
    why: 'the cheapest and best-evidenced fix: title and pay range decide applicant counts [65] [75]'
  - constraint: c-degree-requirement-shrinks-pool
    why: 'a degree or years line removes people the job analysis would admit [1] [68]'
  - constraint: c-local-pool-thin
    why: 'relocation is rare and remote work is valued at 8% of pay; the geography of the posting sets the pool [85] [70]'
  - constraint: c-referral-network-narrow
    why: 'referrals are the best source and the narrowest [60] [81]'
  - constraint: c-ad-wording-and-targeting-exclude
    why: 'the words and the delivery can exclude without intent [77] [66] [78]'
  - constraint: c-employer-image-weak
    why: 'unknown firms are judged on the posting and the recruiter alone [64] [63]'
  - constraint: c-cleared-supply-scarce
    why: 'for cleared roles the pool is fixed by prior sponsorship [80]'
  - constraint: c-channel-mix-untested
    why: 'without source tracking the firm cannot tell which of the above it has [62]'
  legacy: [h-pattern-p1]
  sources: [1, 60, 62, 63, 64, 65, 66, 68, 70, 71, 75, 77, 78, 80, 81, 85]

# ---- sweep 3 (offer), 2026-10-21 ----
- id: pass-then-decline
  name: Candidates pass but decline the offer
  stage: offer
  what: >
    The firm wants the candidate and the candidate says no, or says yes and then does not start. The evidence orders the
    causes: a range held below the market by the labor-category rate [98] [103]; a package that looks smaller than a larger
    employer's once benefits (30 percent of compensation [104]) and arrangements (8 to 20 percent of wages [115]) are counted;
    an offer process that is slow [15] or anchored on prior pay the law no longer lets the firm use [106]; a counteroffer or a
    competing package in the weeks before the start [113] [89]; and, for proposed key personnel, a start date the firm does
    not control [108]. Work conditions and schedules (the matrix's G4 and G6) are adjudicated in sweep 6.
  points_at: [c-salary-above-rate, c-total-comp-gap-vs-large-employers, c-slow-decisions-lose-candidates, c-counteroffer-and-withdrawal, c-offer-process-exposure, c-key-personnel-contingency, c-contract-rates-lag-market]
  reasons:
  - constraint: c-salary-above-rate
    why: 'the first thing to check is whether the range can reach the market at all [98] [110]'
  - constraint: c-total-comp-gap-vs-large-employers
    why: 'the comparison the candidate makes includes benefits and arrangements the offer may not state [104] [115]'
  - constraint: c-slow-decisions-lose-candidates
    why: 'earlier offers are accepted more often [15]'
  - constraint: c-counteroffer-and-withdrawal
    why: 'acceptance is not a start; most managers counter [113]'
  - constraint: c-offer-process-exposure
    why: 'an offer anchored on prior pay or silent on negotiability drifts into gaps the firm cannot defend [106] [95]'
  - constraint: c-key-personnel-contingency
    why: 'a contingent offer asks the candidate to wait for an award [108]'
  - constraint: c-contract-rates-lag-market
    why: 'if the range cannot move, the rate is why [117]'
  legacy: [h-pattern-p4]
  sources: [15, 89, 95, 98, 103, 104, 106, 108, 110, 113, 115, 117]

# ---- sweep 4 (clear and start), 2026-10-21 ----
- id: accept-cannot-start
  name: Candidates accept but cannot start
  stage: clear-start
  what: >
    The offer is accepted and the person is not at work. The evidence puts the causes in an order the firm can check: there
    was no contract need or facility clearance to sponsor against, so nothing started [119] [120]; the investigation is
    running on DCSA's clock, 197 to 243 days on the current figures, against a vacancy that could wait 45 [126] [43];
    eligibility arrived but the credential, the reciprocity decision, the read-in, the polygraph or the cyber certificate
    did not [138] [122] [139]; the wait itself cost the hire, since each week between acceptance and start raises the odds
    of a no-show by about a fifth [144]; there was no funded work for the interval [98] [148]; a start-date check surfaced
    a problem or was taken out of order [128] [130] [136]; the hire is a foreign national waiting on an authorization or a
    visa [132] [142]; or the start depends on an award the firm does not control [108]. The customer-approval case (the
    matrix's E5) is adjudicated in sweep 7.
  points_at: [c-sponsorship-needs-contract-and-fcl, c-clearance-clock-exceeds-vacancy-window, c-eligibility-is-not-access, c-long-interval-loses-accepted-hires, c-no-chargeable-work-before-access, c-start-date-compliance-clocks, c-foreign-national-hire-blocked, c-key-personnel-contingency]
  reasons:
  - constraint: c-sponsorship-needs-contract-and-fcl
    why: 'nothing can be requested without a contract need and a facility clearance [119] [120]'
  - constraint: c-clearance-clock-exceeds-vacancy-window
    why: 'the investigation and adjudication run on a clock the firm does not set [126]'
  - constraint: c-eligibility-is-not-access
    why: 'the credential, the transfer, the read-in and the certificate are separate decisions by separate owners [138] [122] [139]'
  - constraint: c-long-interval-loses-accepted-hires
    why: 'each week of waiting raises the odds the hire never starts [144]'
  - constraint: c-no-chargeable-work-before-access
    why: 'the wait is unbillable and sits in the firm''s rates [98] [148]'
  - constraint: c-start-date-compliance-clocks
    why: 'the first three days carry checks that can end the hire [128] [130] [136]'
  - constraint: c-foreign-national-hire-blocked
    why: 'a non-U.S. person needs an authorization before the work and the visa rules are in flux [132] [142]'
  - constraint: c-key-personnel-contingency
    why: 'a proposed key person starts when the award says so [108]'
  legacy: [h-pattern-p5]
  sources: [43, 98, 108, 119, 120, 122, 126, 128, 130, 132, 136, 138, 139, 142, 144, 148]

# ---- sweep 5 (onboard and develop), 2026-10-21 ----
- id: start-then-struggle
  name: Employees start but struggle
  stage: onboard
  what: >
    The hire is at work and not performing. The evidence orders the causes: the adjustment was left to the newcomer, with
    no insider beside them and supervisor support thinning week by week [152] [156] [155]; the ramp is longer than the rate
    assumed, since output rises for a year where it can be counted [157] [98]; the person does not meet the labor category
    the slot is billed at, or the customer will not accept them in it [99] [173]; the training did not look like the work
    and did not transfer [162]; the senior who should be teaching them is billing elsewhere [158] [99]; access to the site,
    the network or the program is still pending (clear-start) [138]; or the selection measured the wrong thing in the first
    place (select) [1] [7].
  points_at: [c-newcomer-adjustment-left-to-chance, c-ramp-to-productivity-exceeds-plan, c-customer-rejects-junior-staff, c-training-content-unlike-the-work, c-mentoring-capacity-is-senior-billable-time, c-eligibility-is-not-access, c-unvalidated-criteria, c-unstructured-judgement]
  reasons:
  - constraint: c-newcomer-adjustment-left-to-chance
    why: 'structured and social onboarding tactics predict adjustment, and adjustment predicts performance and staying [152] [155]'
  - constraint: c-ramp-to-productivity-exceeds-plan
    why: 'output rises steeply through the first year; the rate assumed it was there on day one [157] [98]'
  - constraint: c-customer-rejects-junior-staff
    why: 'the category''s qualifications are a contract term enforced by audit [99] [173]'
  - constraint: c-training-content-unlike-the-work
    why: 'training transfers when it resembles the work and the supervisor expects it used [162]'
  - constraint: c-mentoring-capacity-is-senior-billable-time
    why: 'learning from knowledgeable coworkers is part of the job''s value and the seniors are billable [158] [99]'
  - constraint: c-eligibility-is-not-access
    why: 'a hire without the badge, the account or the read-in cannot do the work [138]'
  - constraint: c-unvalidated-criteria
    why: 'a screen that did not predict performance let the wrong person through [7]'
  - constraint: c-unstructured-judgement
    why: 'unstructured interviews predict performance weakly (.19) [1]'
  legacy: [h-pattern-p6]
  sources: [1, 7, 98, 99, 138, 152, 155, 156, 157, 158, 162, 173]

# ---- sweep 6 (retain and hand over), 2026-10-22 ----
- id: productive-employees-leave
  name: Productive employees leave
  stage: retain
  what: >
    The people the firm most wants to keep are the ones leaving. The evidence orders the causes by the strength of the
    predictors: they wanted to leave and were looking (ρ .56 and .40), which the firm could have heard [178]; pay fell
    behind peers, new hires or the market, and the comparison, not the level, moved them [182] [92] [93]; there was no
    step up but the wrong one [181] [184]; the firm's own manager was absent and the customer's ran the day [178] [183];
    a vacancy was covered by the remaining staff until the strain showed [178]; the job was onsite and fixed while the
    alternative was not [115] [194]; the contract's end was visible and nothing was said [186] [13]; a larger employer
    paid the external premium for the person the firm trained [93] [187]; and the skills were portable because the firm
    had paid for general ones (develop) [161].
  points_at: [c-pay-lags-capability-and-peers, c-few-steps-up-in-a-small-firm, c-disconnection-from-the-firm-and-the-work, c-vacancy-overload-cascade, c-onsite-schedule-and-commute, c-contract-discontinuity-fear, c-poaching-by-prime-or-customer, c-training-investment-walks-out, c-new-hire-pay-compresses-incumbents]
  reasons:
  - constraint: c-pay-lags-capability-and-peers
    why: 'quits follow the comparison with peers and the market, not the level [182] [92]'
  - constraint: c-few-steps-up-in-a-small-firm
    why: 'internal mobility keeps people and the firm has little of it [181]'
  - constraint: c-disconnection-from-the-firm-and-the-work
    why: 'commitment, fit, satisfaction and the supervisor are the next cluster of predictors [178]'
  - constraint: c-vacancy-overload-cascade
    why: 'covering a vacancy shows up as stress and role conflict, which predict quitting [178]'
  - constraint: c-onsite-schedule-and-commute
    why: 'the arrangements the job cannot offer are worth a fifth of pay to the median worker [115]'
  - constraint: c-contract-discontinuity-fear
    why: 'a visible contract end is a withdrawal cognition with no right of first refusal behind it [178] [186]'
  - constraint: c-poaching-by-prime-or-customer
    why: 'external hires are paid about 18% more and no-poach agreements are criminal [93] [187]'
  - constraint: c-training-investment-walks-out
    why: 'general skills raise the outside value as fast as the inside [161]'
  - constraint: c-new-hire-pay-compresses-incumbents
    why: 'each market-rate hire resets the incumbents'' comparison point [93] [92]'
  legacy: [h-pattern-p7]
  sources: [13, 92, 93, 115, 161, 178, 181, 182, 183, 184, 186, 187, 194]

# ---- sweep 7 (plan), 2026-10-22 ----
- id: customer-rejects
  name: We approve, the customer rejects
  stage: plan
  what: >
    The firm's chosen candidate does not survive the customer's review. The evidence and the rules order the causes:
    the firm and the customer mean different things by qualified, the contract's category line, the evidence's scored
    assessment and the reviewer's own standard [99] [1] [197]; a preference inherited from the customer or the incumbent
    was written as a requirement no one owns [68] [197]; the requisition blended jobs so the candidate fits part of it
    [65] [99]; the customer's review has no clock and the candidate left while it ran [15] [16] [188]; the person was a
    junior in a senior slot [173]; the screen measured the wrong thing (select) [7]; or the requirements changed during
    the search [16]. Rejections that come back without reasons cannot be acted on, and no study of them was found.
  points_at: [c-firm-and-customer-define-qualified-differently, c-preferences-written-as-requirements, c-requisition-blends-several-jobs, c-customer-approval-cycle, c-customer-rejects-junior-staff, c-unvalidated-criteria, c-key-personnel-contingency]
  reasons:
  - constraint: c-firm-and-customer-define-qualified-differently
    why: 'three definitions of qualified, one enforceable, one valid, one decisive [99] [1] [197]'
  - constraint: c-preferences-written-as-requirements
    why: 'a requirement nobody can trace to the contract or a job analysis [68] [32]'
  - constraint: c-requisition-blends-several-jobs
    why: 'the posting described two jobs and the candidate fits one [65] [99]'
  - constraint: c-customer-approval-cycle
    why: 'the review has no period and candidates leave slow processes [188] [15]'
  - constraint: c-customer-rejects-junior-staff
    why: 'the category''s qualifications are enforced by audit [173] [99]'
  - constraint: c-unvalidated-criteria
    why: 'the firm''s own screen did not predict the work [7]'
  - constraint: c-key-personnel-contingency
    why: 'a proposed person the firm could not deliver is a misrepresentation, not a rejection [203] [108]'
  legacy: [h-pattern-p3]
  sources: [1, 7, 15, 16, 32, 65, 68, 99, 108, 173, 188, 197, 203]
