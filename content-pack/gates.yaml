- id: al-warn-federal-only
  name: WARN notices in Alabama (federal WARN only)
  what: 'Alabama has no state plant-closing or mass-layoff notice statute; searches of 2024–2026 bills and of the state agencies found none, and the state''s own WARN list cites no state statute [247]. Federal WARN notices filed in Alabama are published by the Department of Commerce on its Warn List, with columns for Closing or Layoff, Initial Report Date, Planned Starting Date, Company, City and Planned # of Affected Employees; the fetched page displayed 1,000 rows with report dates visible through 2024-09-03 [247]. The U.S. Department of Labor directory lists Alabama''s Rapid Response Coordinator in the Workforce Development Division of the Alabama Department of Workforce, 50 N. Ripley Street, Montgomery, AL 36131, 334-353-8940 [248].'
  governing_text: Federal WARN Act (29 U.S.C. §§ 2101–2109); no Alabama statute
  applies_when: Employers subject to the federal WARN Act with covered closings or layoffs in Alabama; no additional state threshold or notice period exists [247].
  binds:
