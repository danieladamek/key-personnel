- id: eeo-contractor-framework-2026
  name: The contractor EEO framework after the EO 11246 rescission (41 CFR 60-1 ff. removed)
  what: >
    From October 26, 2026 the regulations issued under Executive Order 11246 are removed: 41 CFR parts 60-1, 60-2, 60-3, 60-4,
    60-20, 60-40, 60-50 and 60-999, with the EO 11246 content stripped from part 60-30 [86]. With part 60-1 go the Internet
    Applicant definition and the online-recruiting recordkeeping rule of 2006 [87] [86]. What remains for contractors is
    statutory: Section 503 (written AAP at 50 employees and a $50,000 contract; threshold $20,000; the 7 percent goal and
    applicant self-identification rescinded) and VEVRAA (written AAP; threshold $200,000; veteran applicant and hire reporting
    kept), both effective September 21, 2026 [55]. Executive Order 14173, signed January 21, 2025, revoked the order at Sec. 3(b)(i) and allowed ninety days of continued compliance with the scheme in effect on January 20, 2025, a wind-down OFCCP dates to April 21, 2025 [308] [310]. Title VII and the Uniform Guidelines are unchanged [30] [31].
  governing_text: 91 FR 54444 (August 21, 2026); EO 14173 (January 2025); 41 CFR 60-300 and 60-741 as amended
  applies_when: 'Every federal contractor and subcontractor from 2026-10-26 [86]; the EEO-1 filing duty and the Internet Applicant rule''s fate are to be confirmed from the unread portion of the rule [86] [87] (todo)'
  binds: [attract, select, plan]
  steps:
  - 'Stop maintaining EO 11246 AAPs after 2026-10-26; keep the Section 503 and VEVRAA plans and the veteran applicant data [55] [86]'
  - 'Keep Uniform Guidelines selection-rate records regardless [31]'
  official_url: https://www.federalregister.gov/documents/2026/08/21/2026-17114/rescission-of-executive-order-11246-implementing-regulations
  pending_changes:
  - status: final
    date: '2026-10-26'
    text: 'EO 11246 implementing regulations rescinded [86].'
  - status: final
    date: '2026-09-21'
    text: 'Section 503 and VEVRAA regulations updated [55].'
  as_of: '2026-10-21'
  sources: [30, 31, 55, 86, 87]
  conflicts:
  - 'Whether the EEO-1 filing duty (60-1.7) survives in another instrument and whether the Internet Applicant definition is removed in terms were not in the portion of the rule read; the Section 503/VEVRAA details rest on a law-firm alert [55].'

