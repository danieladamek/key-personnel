  what: Code of Alabama § 25-8-45 requires an employer to obtain a Class I Child Labor Certificate from the department for each location employing any minor aged 14 or 15, and a Class II certificate for any minor aged 16 or 17; the fee for either is fifteen dollars ($15) [251]. The agency page states the same classes and a $15 cost per business location, and adds that certificates are posted in public view and that time records show daily hours with start and end times and break periods [252]. The mirror flags § 25-8-45 as amended by Act 2026-539; the amendment's content was not read [251].
