  what: Code of Alabama § 25-11-5(a) requires an employer to report each new hire, recall or rehire to the department within seven days of hiring, with the employee's name, address, Social Security number and date of hire (Acts 1997, No. 97-228) [249]. The agency page states the same seven-day window, adds the employer FEIN, Alabama employer account number, first day of work and new-hire or recall flag as data elements, allows electronic reporters to transmit twice a month 12 to 16 days apart, and states a fine of up to $25 per violation [250].
