- id: cmmc-2-0
  name: CMMC (Cybersecurity Maturity Model Certification) — 32 CFR part 170 and DFARS 252.204-7021
  what: 'The program rule at 32 CFR part 170 (effective 2024-12-16) sets CMMC levels and assessment types: Level 1 is an annual self-assessment against the 15 FAR 52.204-21 requirements, and Level 2 covers the 110 NIST SP 800-171 R2 requirements by self-assessment or C3PAO certification, with a new assessment every three years and annual affirmation by the Affirming Official in SPRS [305]. The DFARS rule (effective 2025-11-10) makes the required CMMC status a condition of award; contracting officers shall not award without it in SPRS, and contractors need an affirming official under 32 CFR 170.4 [306]. Application is phased: Phase 1 began on the DFARS rule''s effective date, each later phase begins one year after the one before, and the DFARS rule applies the requirement selectively ''until three years after the effective date of the rule'' with full application ''Beginning three years and one day after'' [305] [306]. Phase 2 start on 2026-11-10 and full application on 2028-11-11 follow arithmetically from those texts [306]. (synthesis) The DFARS rule''s own estimates put 1,104 small entities in scope in year one and 229,818 by year four and beyond, out of 337,968 unique entities [306].
  
    '
  governing_text: 32 CFR part 170; 48 CFR 204.75, 252.204-7021, 252.204-7025
  applies_when: A DoD solicitation or contract involves processing, storing or transmitting FCI or CUI; subcontractors are reached by flow-down, and the requirement is met at time of award [306].
  binds:
  - clear-start
  - plan
  - develop
  steps:
  - 'Level 1 (Self): the OSA meets all 15 FAR 52.204-21 requirements and self-assesses annually, with no exceptions [305].'
  - 'Level 2 (C3PAO): the OSA hires a C3PAO to assess compliance with the 110 requirements; a new assessment is due every three years with an annual affirmation in SPRS (170.22) [305].'
  - Any POA&M is closed within 180 days of the Conditional CMMC Status Date (170.21) [305].
  - 'Assessor personnel: a CCA candidate must first be a CCP and complete a Tier 3 background investigation or equivalent; a CCP may take part in Level 2 certification assessments under CCA oversight, and CCAs make the final Level 2 (C3PAO) determinations [305].'
  - Posting a self-assessment result in SPRS is estimated by the rule at about 5 minutes [306].
  geo: us
  sector: defense
  official_url: https://www.ecfr.gov/current/title-32/subtitle-A/chapter-I/subchapter-D/part-170
  pending_changes:
  - status: final
    date: '2026-11-10'
    text: Phase 2 begins one calendar year after Phase 1, which started on the DFARS rule's effective date of 2025-11-10 [305] [306].
  - status: final
    date: '2028-11-11'
    text: Full application of the DFARS requirement 'Beginning three years and one day after the effective date of the rule' [306].
  as_of: '2026-10-22'
  sources:
  - 305
  - 306
  conflicts:
  - The 32 CFR 170.4 definitions of 'Affirming Official', CCP and CCA were not captured verbatim; the assessor-personnel statements come from the rule preamble [305].
  - Calendar dates for Phase 2 and full application are arithmetic from the rules' relative wording; the texts themselves say 'one calendar year following' and 'three years and one day after' [306].
- id: vevraa-section-503-aaps
  name: VEVRAA and Section 503 affirmative action plans (what remains after the 2026 OFCCP rules)
  what: 'VEVRAA obligations continue: the rule published 2026-08-21 (effective 2026-09-21) revises 41 CFR 60-300.40(a) so that an affirmative action plan is required of every Government contractor with 50 or more employees and a contract of $200,000 or more, reflecting an inflation-adjusted coverage threshold raised from $150,000 [309]. Section 503 obligations continue with the same 50-employee threshold and a $50,000 contract or subcontract (60-741.40(b)); the companion rule, effective 2026-09-21, rescinds the disability self-identification invitation at 60-741.42 and the 7% utilization goal and analysis at 60-741.45, while its part 60-30 amendment takes effect 2026-12-21 [310]. OFCCP states that Section 503 and VEVRAA, with their implementing regulations, remain in effect, that the AAP certification period ''will remain closed'', that pending compliance reviews were administratively closed, and that a VAHBP moratorium runs through 2027-05-07 [310].
  
    '
  governing_text: 41 CFR part 60-300 (VEVRAA), 60-300.40(a), 60-300.65; 41 CFR part 60-741 (Section 503), 60-741.40(b); 41 CFR part 60-30
  applies_when: 'VEVRAA AAP: 50 or more employees and a contract of $200,000 or more; Section 503 AAP: 50 or more employees and a Federal contract or subcontract of $50,000 or more [309] [310].'
  binds:
  - plan
  - select
  - attract
  steps:
  - VEVRAA rule effective 2026-09-21 removes EO 11246 cross-references and moves administrative-enforcement procedures into 60-300.65 [309].
  - Section 503 rule effective 2026-09-21 removes the self-identification requirement and the 7% goal; nondiscrimination provisions and the written AAP remain [310].
  - The Section 503 amendment to part 60-30 takes effect 2026-12-21 [310].
  geo: us
  sector: all
  official_url: https://www.federalregister.gov/documents/2026/08/21/2026-17116/modifications-to-the-regulations-implementing-the-vietnam-era-veterans-readjustment-assistance-act
  pending_changes:
  - status: final
    date: '2026-12-21'
    text: Section 503 rule's amendment to 41 CFR part 60-30 takes effect [310].
  as_of: '2026-10-22'
  sources:
  - 309
  - 310
  conflicts:
  - A law-firm compilation lists veteran self-identification invitations, hiring benchmarks and VETS-4212 reporting as retained under VEVRAA; this was not confirmed in the rule text read [309].
  - A VEVRAA correction notice (FR Doc. 2026-17757, 2026-08-31) was listed by the Federal Register API and not read [309].
  - OFCCP's undated page says the AAP certification period 'will remain closed' and does not mention the August 2026 rules in the portion read [310].
