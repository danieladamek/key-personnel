- id: ugesp
  name: Uniform Guidelines on Employee Selection Procedures (29 CFR 1607)
  what: >
    The 1978 framework the EEOC, DOL, DOJ and the Civil Service Commission adopted for judging selection procedures under
    Title VII [30]. It expects records of selection rates by sex and by race or ethnic group, treats a group selection rate
    below four-fifths of the highest group's as generally evidencing adverse impact, and generally does not expect component
    validation when the overall process shows no impact [31]. A procedure with adverse impact needs criterion-related, content
    or construct validity evidence tied to important elements of job performance, cutoffs set to normal expectations of
    proficiency, and more evidence for ranking than for pass/fail use [32].
  governing_text: 29 CFR Part 1607; 42 U.S.C. 2000e-8 and 2000e-12
  applies_when: 'Any employer covered by Title VII using any selection procedure, including algorithmic tools used to make or inform decisions [35]'
  binds: [select]
  steps:
  - 'Keep selection-rate records by sex and by race or ethnic group (sampling allowed at high volume) [31]'
  - 'Compare each group''s rate to the highest group''s; investigate below four-fifths, with statistical and practical significance in mind [31]'
  - 'Hold validity evidence (criterion, content or construct) for any procedure with adverse impact; more for ranking than pass/fail [32]'
  - 'Document per 1607.15 (not read this sweep; todo)'
  official_url: https://www.law.cornell.edu/cfr/text/29/part-1607
  pending_changes: []
  as_of: '2026-10-21'
  sources: [30, 31, 32, 35]
  conflicts: []

- id: eeoc-selection-procedures
  name: Title VII, ADA and ADEA rules on tests and selection procedures (EEOC fact sheet)
  what: >
    The EEOC's technical assistance of December 1, 2007 maps the three statutes onto selection: disparate treatment is
    intentional; disparate impact is a neutral procedure that disproportionately excludes a protected group and must be
    job-related and consistent with business necessity, with a less discriminatory alternative available to the challenger;
    the ADA bars disability-related questions and medical exams before a conditional offer; the ADEA permits neutral practices
    affecting workers 40 and older only on a reasonable factor other than age [33]. Vendor documentation helps but the employer
    stays responsible for validation [33].
  governing_text: Title VII of the Civil Rights Act of 1964; Americans with Disabilities Act; Age Discrimination in Employment Act
  applies_when: 'All covered employers using cognitive or physical tests, work samples and simulations, medical inquiries, personality or integrity tests, background or credit checks, appraisals or English-proficiency tests [33]'
  binds: [select, offer]
  steps:
  - 'Administer tests without regard to protected characteristics [33]'
  - 'Validate for the specific job and purpose; obtain vendor documentation but own the responsibility [33]'
  - 'If a procedure screens out a protected group, look for an equally effective alternative with less impact and adopt it if one exists [33]'
  - 'Update test specifications as the job changes [33]'
  official_url: https://eeoc.gov/laws/guidance/employment-tests-and-selection-procedures
  pending_changes: []
  as_of: '2026-10-21'
  sources: [33]
  conflicts: []

- id: ada-pre-offer-inquiries
  name: ADA limits on pre-offer disability questions and medical examinations
  what: >
    Before a conditional offer an employer may not ask disability-related questions, defined as questions likely to elicit
    information about a disability, or require medical examinations; it may ask whether the applicant can perform job
    functions with or without reasonable accommodation, may ask for a demonstration if everyone in the category is asked, and
    may ask about licences, attendance and arrest or conviction records [34]. After a conditional offer, medical questions and
    exams are allowed if required of everyone entering the job category; a withdrawn offer must be job-related and consistent
    with business necessity, or rest on a direct threat for safety exclusions [34]. Physical agility and fitness tests are not
    medical unless physiological responses are measured; psychological tests are medical if they can identify a mental
    disorder; tests for current illegal drug use are not medical examinations [34].
  governing_text: Americans with Disabilities Act, 42 U.S.C. 12112(d); EEOC Enforcement Guidance 915.002 (October 10, 1995)
  applies_when: 'Every covered employer at the application, interview and conditional-offer steps; the 1995 guidance predates the ADA Amendments Act of 2008 [34]'
  binds: [select, offer, clear-start]
  steps:
  - 'Pre-offer: ask about ability to perform job functions with or without accommodation; ask whether accommodation is needed for the hiring process [34]'
  - 'Post-offer: medical inquiries and exams only if applied to all entering employees in the same job category [34]'
  - 'Keep the offer "real": evaluate all reasonably obtainable non-medical information before extending it [34]'
  official_url: https://www.eeoc.gov/laws/guidance/enforcement-guidance-preemployment-disability-related-questions-and-medical
  pending_changes: []
  as_of: '2026-10-21'
  sources: [33, 34]
  conflicts: []

- id: arrest-conviction-records
  name: Criminal records under Title VII (EEOC 2012 guidance)
  what: >
    A criminal-record policy that disproportionately screens out a protected group must be job-related and consistent with
    business necessity; the EEOC accepts a validated screen or a targeted screen built on the nature and gravity of the
    offence, the time elapsed and the nature of the job, paired with an individualised assessment in which the person can
    respond [47]. Exclusions based on an arrest alone are generally not job-related; a conviction is usually sufficient
    evidence of conduct [47]. Federal statutes and regulations that bar people with certain records from certain jobs are a
    defence, but only as far as the federal requirement reaches; for cleared work the national security exception applies only
    where the position is actually subject to federal security requirements and the action followed a clearance denial [47].
  governing_text: Title VII; EEOC Enforcement Guidance 915.002 (April 25, 2012); Green v. Missouri Pacific Railroad (8th Cir. 1977)
  applies_when: 'Any employer using criminal history in selection; federal contractors additionally under the Fair Chance Act (fair-chance-act-contractors)'
  binds: [select, clear-start]
  steps:
  - 'Eliminate blanket exclusions; write a targeted screen naming disqualifying offences and justified durations [47]'
  - 'Give an individualised assessment: notify, allow a response, weigh circumstances, age at conviction, work history, rehabilitation [47]'
  - 'Limit inquiries to records that would actually justify exclusion; keep the information confidential [47]'
  official_url: https://www.eeoc.gov/laws/guidance/enforcement-guidance-consideration-arrest-and-conviction-records-employment-decisions
  pending_changes: []
  as_of: '2026-10-21'
  sources: [47]
  conflicts: []

- id: fair-chance-act-contractors
  name: Federal Fair Chance Act (criminal-history timing for federal contractors)
  what: >
    Since December 20, 2021, federal contractors may not ask about or seek an applicant's criminal history for positions
    within the scope of a federal contract until after a conditional offer, under the Fair Chance Act enacted in the FY2020
    National Defense Authorization Act of December 20, 2019 [48]. Exceptions cover positions with law-enforcement or
    national-security duties, positions requiring access to classified information, and positions where a law requires the
    inquiry earlier; a first violation brings a notice and warning and later violations can suspend payments under the
    contract [48].
  governing_text: Fair Chance to Compete for Jobs Act of 2019 (Pub. L. 116-92, FY2020 NDAA); implementing FAR clause TODO(author)
  applies_when: 'Federal contractors hiring for positions related to work under a federal contract; largely exempts cleared positions [48]'
  binds: [select, offer]
  steps:
  - 'Remove criminal-history questions from applications and interviews for contract positions; ask after the conditional offer [48]'
  - 'Confirm whether the position falls in an exception (classified access, national security, law enforcement, statutory requirement) [48]'
  official_url: https://littler.com/news-analysis/asap/new-federal-fair-chance-act-applies-federal-contractors-and-agencies
  pending_changes: []
  as_of: '2026-10-21'
  sources: [48]
  conflicts:
  - 'Only a law-firm summary was read; the FAR subpart and clause number and the OPM exclusion regulations must be confirmed from primary text (todo t-P008).'

- id: citizenship-status-export-control
  name: Citizenship-status discrimination in export-controlled hiring (8 U.S.C. 1324b)
  what: >
    An employer may not limit a job to U.S. citizens, or to citizens and permanent residents, unless a law, regulation,
    executive order or government contract requires it; ITAR and EAR do not, because the export rules' "U.S. person" matches
    the protected-individual definition in 8 U.S.C. 1324b(a)(3): citizens, nationals, lawful permanent residents, refugees and
    asylees [49]. There is no good-faith exception [49]. DOJ's Civil Rights Division fact sheet of April 18, 2023 says not to
    state that export rules require a citizenship, to make clear U.S. persons includes more than citizens, to keep export
    assessments separate from Form I-9, and not to limit which I-9 documents a worker presents [51]. Settlements include
    Georgia Tech ($500,000, August 2023), more than $2.5 million across job-platform users (2022–2023), General Motors
    ($365,000, April 2023) and American CyberSystems (May 2023) [49] [50].
  governing_text: 8 U.S.C. 1324b; 22 CFR 120 (ITAR) and 15 CFR 772 (EAR) definitions of U.S. person; DOJ IER employer fact sheet (April 18, 2023)
  applies_when: 'Any posting or screen for work involving ITAR- or EAR-controlled items or technical data [131] [49]; any employer with four or more employees under 1324b (threshold not read this sweep; todo)'
  binds: [attract, select, clear-start]
  steps:
  - 'Write postings that admit all U.S. persons; never "U.S. citizens only" for export reasons [51] [50]'
  - 'Run export-compliance screening as a separate step from Form I-9, and let workers choose their I-9 documents [51] [49]'
  - 'Restrict by citizenship only where a law or a government contract requires it, and cite that requirement [49]'
  official_url: https://www.justice.gov/opa/pr/justice-department-secures-agreement-it-staffing-and-services-company-posting-discriminatory
  pending_changes: []
  as_of: '2026-10-21'
  sources: [49, 50, 51, 131]
  conflicts: []

- id: ai-screening-laws
  name: Automated and AI screening tools (federal framework and state laws)
  what: >
    Federally, an algorithmic tool used to make or inform a selection decision is a selection procedure under the Uniform
    Guidelines and the employer answers for a vendor's tool, as the EEOC stated on May 18, 2023 in technical assistance it
    removed on January 27, 2025; the Title VII rules it restated remain in force [35] [36]. New York City Local Law 144 requires
    a bias audit no more than a year old, a published summary and candidate notice, with penalties of $500–$1,500 a day [37].
    Illinois Public Act 103-0804 bars discriminatory use of AI in employment decisions and requires notice from January 1,
    2026; the Department of Human Rights withdrew its proposed clarifying rules on June 2, 2026 [38]. California's Civil Rights
    Council regulations, effective October 1, 2025, define automated-decision systems, extend liability to agents, treat
    anti-bias testing before and after adoption as a defence factor, and require four-year retention of ADS records [40].
    Colorado's SB 24-205 was delayed to June 30, 2026 by SB25B-004 with amendments expected [39].
  governing_text: Title VII and 29 CFR 1607 (federal); NYC Local Law 144 of 2021; Illinois Public Act 103-0804; 2 CCR 11008 et seq. (California); Colorado SB 24-205 as amended by SB25B-004
  applies_when: 'Any employer using software, algorithms or AI to screen, rank, score or interview candidates; state duties attach by the candidate''s or the job''s location [37] [38] [40]'
  binds: [attract, select]
  steps:
  - 'Ask the vendor whether the tool was tested for substantially lower selection rates by group and by what standard [35]'
  - 'New York City: obtain the bias audit, publish the summary, notify candidates [37]'
  - 'Illinois: give notice when AI is used to influence or facilitate a covered decision [38]'
  - 'California: test for bias before and after adoption and keep ADS records four years [40]'
  - 'Colorado: confirm the law''s status after June 30, 2026 before relying on it (todo)'
  official_url: https://www.osc.ny.gov/state-agencies/audits/2025/12/02/enforcement-local-law-144-automated-employment-decision-tools
  pending_changes:
  - status: withdrawn
    date: '2025-01-27'
    text: 'EEOC removed its May 2023 AI technical assistance from its website; the underlying law did not change [36] [35].'
  - status: pending-implementation
    date: '2026-06-02'
    text: 'Illinois IDHR withdrew and postponed its proposed notice rules; the statute remains in effect [38].'
  - status: final
    date: '2025-08-28'
    text: 'Colorado SB25B-004 moved the AI Act''s effective date to 2026-06-30; substantive amendments were expected in the 2026 session and must be checked [39].'
  - status: pending-implementation
    date: '2027-01-01'
    text: 'Colorado SB 26-189 (signed 2026-05-14) repealed and reenacted the Act: notice before ADMT materially influences an employment decision, an explanation within 30 days of an adverse outcome, human review and three-year records from 2027-01-01; SB 24-205 never took effect after the stipulated non-enforcement order of 2026-04-27 [222] [221].'
  - status: pending-implementation
    date: '2027-01-01'
    text: 'Connecticut SB 5 (employer notice from 2027-10-01), Delaware HB 380 (2027-01-01) and three California bills (AB 1883, SB 951 from 2027-01-01; SB 947 from 2027-07-01) add duties listed in the October 2026 chart; states.yaml carries them with the statutes pending [220].'
  as_of: '2026-10-22'
  sources: [35, 36, 37, 38, 39, 40, 220, 221, 222]
  conflicts:
