- id: vevraa-job-listing
  name: VEVRAA mandatory job listing (41 CFR 60-300.5(a)(2))
  what: >
    A covered federal contractor lists every employment opening, at every establishment and whether or not the opening is
    contract-funded, with the appropriate employment service delivery system where the opening occurs, at least concurrently
    with any other recruiting; listing with the state workforce agency job bank satisfies it [73]. Executive and senior
    management positions, positions filled from within, and positions of three days or less are excepted [73]. The contractor
    tells the ESDS in each state that it is a federal contractor, that it wants priority referral of protected veterans, and
    gives its hiring locations and contacts; the listing must accept referrals of veterans and nonveterans alike [73].
  governing_text: Vietnam Era Veterans' Readjustment Assistance Act, 38 U.S.C. 4212; 41 CFR 60-300.5(a)(2)
  applies_when: 'Contracts at or above the VEVRAA threshold ($200,000 under the 2026 update [55]; the printed clause still shows a $100,000 subcontract flow-down figure [73]); the written AAP applies at 50 employees and a covered contract [55]'
  binds: [attract]
  steps:
  - 'Post every opening to the state workforce agency job bank no later than other recruiting [73]'
  - 'Notify the ESDS of contractor status, hiring sites, contacts and any outside search firms; update on change [73]'
  - 'Keep the veteran applicant and hire data that remains required after the 2026 rule [55]'
  official_url: https://www.law.cornell.edu/cfr/text/41/60-300.5
  pending_changes:
  - status: final
    date: '2026-09-21'
    text: 'VEVRAA regulations updated; coverage threshold $200,000; written AAP and veteran applicant and hire reporting remain [55].'
  as_of: '2026-10-21'
  sources: [55, 73]
  conflicts:
  - 'Threshold: the clause text read shows $100,000 for subcontract flow-down [73]; the 2026 final rule reports $200,000 [55]. The amended 60-300.5 text is a todo.'

- id: adea-advertising
  name: Age-preference terms in help-wanted ads (29 CFR 1625.4)
  what: >
    An ad that uses terms such as "age 25 to 35", "young", "college student", "recent college graduate", "boy" or "girl"
    indicates an unlawful preference against workers forty and older unless a statutory exception applies; preferences for
    older workers ("over age 60", "retirees") are permitted; asking an applicant's age is scrutinised for a lawful purpose [78].
  governing_text: Age Discrimination in Employment Act; 29 CFR 1625.4
  applies_when: 'Any employer covered by the ADEA writing a job advertisement or application [78]'
  binds: [attract]
  steps:
  - 'Remove the listed age terms from postings and campus-recruiting copy [78]'
  official_url: https://www.law.cornell.edu/cfr/text/29/1625.4
  pending_changes: []
  as_of: '2026-10-21'
  sources: [78]
  conflicts: []

- id: pay-transparency-posting-laws
  name: Pay ranges in job postings (state and local laws)
  what: >
    Thirteen states and the District of Columbia require a pay range in the posting itself, at thresholds from one employee
    (Colorado, DC) to fifty (Hawaii): California (15+), Colorado (1+), Delaware (26+, from September 26, 2027), Hawaii (50+),
    Illinois (15+), Maryland, Massachusetts (25+), Minnesota (30+), New Jersey (10+), New York (4+), Vermont (5+), Washington
    (15+) and DC (1+), with local rules in Ohio cities and parts of New Jersey and New York; Connecticut, Rhode Island and Nevada
    require ranges at other points, not in the posting [76]. By May 2025, 59 percent of US postings carried a salary figure
    regardless [75]. Within a title, a 10 percent higher posted wage draws 7.7 percent more applicants [65].
  governing_text: state statutes (sweep-8 primaries); California SB 642 effective 2026-01-01 clarifies "pay scale" [76]
  applies_when: 'Postings for work performed in, or open to applicants in, a covered jurisdiction [76] [207]; remote postings reachable from a covered state are commonly treated as covered [76] (secondary; the statutes are a todo)'
  binds: [attract, offer]
  steps:
  - 'Show a good-faith range in every posting; the rule attaches by jurisdiction and the range is also the strongest applicant-count lever [65] [76]'
  official_url: https://www.jacksonlewis.com/publication/navigating-2026-pay-transparency-laws-and-employer-obligations
  pending_changes:
  - status: final
    date: '2026-07-01'
    text: 'Virginia requires a wage or salary range in every public and internal posting and bans salary-history inquiries, with a private right of action after a 15-day cure notice [223] [224].'
  - status: final
    date: '2026-07-29'
    text: 'Maine requires a pay range in every posting for employers with ten or more employees [223] [224].'
  - status: final
    date: '2026-10-01'
    text: 'Connecticut PA 26-12 requires the wage or wage range and a benefits description in every advertisement, for all employers [224].'
  - status: final
    date: '2027-09-26'
    text: 'Delaware''s posting requirement (more than 25 employees) takes effect [76] [223].'
  as_of: '2026-10-22'
  sources: [65, 75, 76, 207, 223, 224]
