name: Build, test and deploy Key Personnel

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 10 * * 1' # weekly: re-refresh the BLS series and redeploy

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # The weekly schedule only re-refreshes and redeploys; pushes and manual runs test first.
  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      # build:content exits 1 on content-pack errors; the app still builds from what validated and lists the
      # errors on /methods, so annotate and continue.
      - name: Build content
        run: npm run build:content || echo "::error title=Content build::content-pack has build errors — see content-pack/BUILD-ERRORS.md and /methods"
      # e2e runs against a fixture BLS file, never the live API.
      - name: Use the fixture BLS file
        run: mkdir -p public/data/benchmarks && cp tests/fixtures/benchmarks/latest.json public/data/benchmarks/latest.json
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  deploy:
    needs: test
    if: always() && (needs.test.result == 'success' || needs.test.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build content
        run: npm run build:content || echo "::error title=Content build::content-pack has build errors — see content-pack/BUILD-ERRORS.md and /methods"
      # A failed series must not block the deploy: refresh-bls writes every series' result (failures included)
      # before exiting non-zero, and /benchmarks shows the failure beside the pack's figure. Never committed.
      - name: Refresh BLS series
        run: npm run refresh:bls || echo "::warning title=BLS refresh::at least one series failed — see public/data/benchmarks/latest.json"
      - name: BLS refresh summary
        if: always()
        run: |
          if [ -f public/data/benchmarks/latest.json ]; then
            { echo "## BLS refresh"; echo '```json'; cat public/data/benchmarks/latest.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Build
        run: npm run build
        env:
          BASE_PATH: /key-personnel/
      - name: SPA fallback
        run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v5
